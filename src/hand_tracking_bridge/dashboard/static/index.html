<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hand Tracking Bridge — Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background:
        radial-gradient(circle at 15% 20%, rgba(0, 212, 170, 0.16), transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(240, 192, 64, 0.12), transparent 45%),
        #0d0d0d;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      padding: 16px;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      inset: -20%;
      pointer-events: none;
      z-index: -1;
      opacity: 0.25;
      animation: drift 16s ease-in-out infinite alternate;
    }

    body::before {
      background: conic-gradient(from 90deg, rgba(0, 212, 170, 0.18), transparent 50%, rgba(240, 192, 64, 0.16));
      filter: blur(46px);
    }

    body::after {
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 34px 34px;
      animation-duration: 24s;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      border-bottom: 1px solid #333;
      padding-bottom: 12px;
      animation: reveal-up 500ms ease-out both;
    }

    header h1 { font-size: 1.2rem; color: #00d4aa; letter-spacing: 2px; text-transform: uppercase; }

    #status {
      display: flex; align-items: center; gap: 8px; font-size: 0.8rem;
    }
    #status-dot {
      width: 10px; height: 10px; border-radius: 50%; background: #555;
      transition: background 0.3s, box-shadow 0.3s;
    }
    #status-dot.connected {
      background: #00d4aa;
      box-shadow: 0 0 0 0 rgba(0, 212, 170, 0.7);
      animation: status-pulse 1.6s infinite;
    }
    #status-dot.disconnected { background: #ff4444; }

    .audio-btn {
      border: 1px solid #2f5f53;
      background: #12201b;
      color: #9de4d0;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .audio-btn:hover {
      background: #183128;
      color: #c8fff0;
      border-color: #3d7c6a;
    }
    .audio-btn.on {
      background: #00d4aa;
      color: #082018;
      border-color: #00d4aa;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 16px;
    }

    .card {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 16px;
      opacity: 0;
      transform: translateY(14px);
      animation: reveal-up 550ms ease-out forwards;
      transition: transform 220ms ease, border-color 220ms ease, box-shadow 220ms ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: #3a3a3a;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
    }

    .card h2 {
      font-size: 0.85rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }

    canvas {
      width: 100%;
      aspect-ratio: 4/3;
      background: #0a0a0a;
      border-radius: 4px;
      display: block;
    }

    .gesture-label {
      text-align: center;
      font-size: 1.6rem;
      font-weight: bold;
      color: #00d4aa;
      min-height: 2.4rem;
      margin-top: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: transform 160ms ease, color 160ms ease;
    }

    .gesture-label.flash {
      animation: gesture-bump 220ms ease;
    }

    .metrics { display: flex; flex-direction: column; gap: 10px; }

    .metric-row { display: flex; align-items: center; gap: 10px; font-size: 0.82rem; }
    .metric-name { width: 80px; color: #888; flex-shrink: 0; }
    .bar-bg {
      flex: 1;
      height: 14px;
      background: #222;
      border-radius: 7px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: #00d4aa;
      border-radius: 7px;
      transition: width 0.16s ease;
      min-width: 2px;
    }
    .bar-fill.red { background: #ff4c4c; }
    .bar-fill.yellow { background: #f0c040; }
    .metric-value { width: 40px; text-align: right; font-size: 0.75rem; color: #aaa; }

    .value-pop {
      animation: value-pop 200ms ease;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat-box {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 10px 12px;
      text-align: center;
    }
    .stat-label { font-size: 0.7rem; color: #666; text-transform: uppercase; margin-bottom: 4px; }
    .stat-value { font-size: 1.1rem; color: #fff; font-weight: bold; }

    .finger-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 4px;
    }
    .finger-box {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .finger-name { font-size: 0.6rem; color: #666; text-transform: uppercase; }
    .finger-bar-bg {
      width: 24px; height: 80px;
      background: #1a1a1a;
      border-radius: 4px;
      display: flex; align-items: flex-end;
      overflow: hidden;
      border: 1px solid #2a2a2a;
    }
    .finger-bar-fill {
      width: 100%;
      background: #7b61ff;
      transition: height 0.16s ease;
      border-radius: 3px;
    }
    .finger-val { font-size: 0.65rem; color: #888; }

    .palm-display {
      display: flex; justify-content: space-around; margin-top: 8px;
    }
    .palm-axis { text-align: center; }
    .palm-axis .axis-label { font-size: 0.65rem; color: #666; text-transform: uppercase; }
    .palm-axis .axis-val { font-size: 0.9rem; color: #f0c040; }

    footer {
      margin-top: 20px;
      text-align: center;
      font-size: 0.7rem;
      color: #444;
      animation: reveal-up 700ms ease-out both;
    }

    @keyframes reveal-up {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes status-pulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 212, 170, 0.6); }
      70% { box-shadow: 0 0 0 10px rgba(0, 212, 170, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 212, 170, 0); }
    }

    @keyframes value-pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); color: #ffffff; }
      100% { transform: scale(1); }
    }

    @keyframes gesture-bump {
      0% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
      100% { transform: translateY(0); }
    }

    @keyframes drift {
      from { transform: translate3d(-1%, -1%, 0) scale(1); }
      to { transform: translate3d(1%, 1%, 0) scale(1.03); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>Hand Tracking Bridge</h1>
  <div id="status">
    <div id="status-dot" class="disconnected"></div>
    <span id="status-text">Disconnected</span>
    &nbsp;|&nbsp;
    <span id="fps-display">0 fps</span>
    &nbsp;|&nbsp;
    <span id="latency-display">0 ms</span>
    &nbsp;|&nbsp;
    <button id="audio-enable-btn" class="audio-btn">Enable Sound</button>
  </div>
</header>

<div class="grid" id="hands-container">
  <!-- Hand cards injected by JS -->
</div>

<div style="margin-top:16px;" class="grid">
  <div class="card">
    <h2>Pipeline Stats</h2>
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Frames</div>
        <div class="stat-value" id="stat-frames">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Latency</div>
        <div class="stat-value" id="stat-latency">— ms</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Hands</div>
        <div class="stat-value" id="stat-hands">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">FPS</div>
        <div class="stat-value" id="stat-fps">0</div>
      </div>
    </div>
  </div>
</div>

<footer>Hand Tracking Bridge v2 &mdash; MediaPipe + OSC + WebSocket</footer>

<script>
// ─── MediaPipe hand connection pairs ────────────────────────────────────────
const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],     // Thumb
  [0,5],[5,6],[6,7],[7,8],     // Index
  [0,9],[9,10],[10,11],[11,12],// Middle
  [0,13],[13,14],[14,15],[15,16],// Ring
  [0,17],[17,18],[18,19],[19,20],// Pinky
  [5,9],[9,13],[13,17]         // Palm
];

const LANDMARK_COLOR = '#00d4aa';
const BONE_COLOR = 'rgba(0, 212, 170, 0.4)';
const ABSENT_COLOR = '#2a2a2a';

// ─── Gesture audio mapping ─────────────────────────────────────────────────
const GESTURE_SOUNDS = {
  'fist': 262,         // C4
  'open': 330,         // E4
  'peace': 392,        // G4
  'thumbs_up': 523,    // C5
  'pointing': 659,     // E5
  'none': 0,           // Silent
};

// ─── State ───────────────────────────────────────────────────────────────────
let ws = null;
let frameCount = 0;
let lastFrameTime = performance.now();
let fpsBuffer = [];
let audioContext = null;
let lastGesturePerHand = {};
let lastSoundAt = {};

// ─── DOM ─────────────────────────────────────────────────────────────────────
const container = document.getElementById('hands-container');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const fpsDisplay = document.getElementById('fps-display');
const latencyDisplay = document.getElementById('latency-display');
const audioEnableBtn = document.getElementById('audio-enable-btn');

// ─── Initialize audio context ──────────────────────────────────────────────
function initAudio() {
  if (audioContext) return audioContext;
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioContext = new AudioContext();
    console.log('Audio context created:', audioContext.state);
    return audioContext;
  } catch (e) {
    console.warn('Web Audio API not supported:', e);
    return null;
  }
}

function resumeAudio() {
  const ctx = initAudio();
  if (!ctx) return Promise.resolve(false);
  if (ctx.state === 'suspended') {
    return ctx.resume().then(() => {
      console.log('Audio context resumed');
      if (audioEnableBtn) {
        audioEnableBtn.textContent = 'Sound On';
        audioEnableBtn.classList.add('on');
      }
      return true;
    }).catch(() => false);
  }
  if (audioEnableBtn) {
    audioEnableBtn.textContent = 'Sound On';
    audioEnableBtn.classList.add('on');
  }
  return Promise.resolve(true);
}

function playTone(freq, duration = 0.16, volume = 0.26) {
  if (!audioContext || audioContext.state !== 'running') return;
  const now = audioContext.currentTime;
  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();
  const filter = audioContext.createBiquadFilter();

  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
  filter.type = 'lowpass';
  filter.frequency.value = freq * 2;

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audioContext.destination);
  osc.start(now);
  osc.stop(now + duration);
}

function enableSound() {
  resumeAudio().then((ok) => {
    if (ok) {
      // audible confirmation tone
      playTone(880, 0.12, 0.22);
    }
  });
}

// ─── Play gesture sound ────────────────────────────────────────────────────
function playGestureSound(handIdx, gesture) {
  if (!audioContext) {
    console.warn('Audio context not initialized');
    return;
  }
  
  if (audioContext.state === 'suspended') {
    console.warn('Audio context suspended. Click on the page to enable sound.');
    return;
  }

  if (!gesture || gesture === 'none') return;

  const freq = GESTURE_SOUNDS[gesture];
  if (!freq || freq === 0) return;

  const nowMs = performance.now();
  const key = `hand_${handIdx}`;
  if (lastSoundAt[key] && (nowMs - lastSoundAt[key]) < 350) {
    return;
  }
  lastSoundAt[key] = nowMs;

  try {
    console.log(`🔊 Playing gesture sound: ${gesture} (${freq}Hz)`);
    playTone(freq);
  } catch (e) {
    console.error('Error playing gesture sound:', e);
  }
}

// ─── Hand card builder ───────────────────────────────────────────────────────
function createHandCard(idx) {
  const card = document.createElement('div');
  card.className = 'card';
  card.id = `hand-${idx}`;
  card.style.animationDelay = `${idx * 120}ms`;
  card.innerHTML = `
    <h2>Hand ${idx} <span id="hand-${idx}-label" style="color:#555;font-size:0.7rem;margin-left:8px;">Not detected</span></h2>
    <canvas id="hand-${idx}-canvas" width="320" height="240"></canvas>
    <div class="gesture-label" id="hand-${idx}-gesture">—</div>
    <div class="metrics" style="margin-top:14px;">
      ${['pinch','openness','velocity_x','velocity_y'].map(k => `
        <div class="metric-row">
          <span class="metric-name">${k}</span>
          <div class="bar-bg"><div class="bar-fill ${k.startsWith('velocity') ? 'yellow' : ''}" id="hand-${idx}-bar-${k}" style="width:0%"></div></div>
          <span class="metric-value" id="hand-${idx}-val-${k}">0.00</span>
        </div>`).join('')}
    </div>
    <div style="margin-top:14px;">
      <div style="font-size:0.75rem;color:#666;text-transform:uppercase;margin-bottom:8px;">Finger Flexion</div>
      <div class="finger-grid" id="hand-${idx}-fingers"></div>
    </div>
    <div style="margin-top:14px;">
      <div style="font-size:0.75rem;color:#666;text-transform:uppercase;margin-bottom:4px;">Palm Orientation</div>
      <div class="palm-display">
        ${['roll','pitch','yaw'].map(a => `
          <div class="palm-axis">
            <div class="axis-label">${a}</div>
            <div class="axis-val" id="hand-${idx}-palm-${a}">0.00</div>
          </div>`).join('')}
      </div>
    </div>
  `;
  return card;
}

function animateTextChange(el, nextText) {
  if (!el) return;
  const next = String(nextText);
  if (el.textContent !== next) {
    el.textContent = next;
    el.classList.remove('value-pop');
    void el.offsetWidth;
    el.classList.add('value-pop');
  }
}

function createFingerBars(handIdx, fingers) {
  const container = document.getElementById(`hand-${handIdx}-fingers`);
  if (!container) return;
  if (container.children.length === 0) {
    fingers.forEach(f => {
      container.innerHTML += `
        <div class="finger-box">
          <div class="finger-bar-bg">
            <div class="finger-bar-fill" id="hand-${handIdx}-ff-${f.name}" style="height:0%"></div>
          </div>
          <div class="finger-name">${f.name.slice(0,3)}</div>
          <div class="finger-val" id="hand-${handIdx}-fv-${f.name}">0.0</div>
        </div>`;
    });
  }
  fingers.forEach(f => {
    const bar = document.getElementById(`hand-${handIdx}-ff-${f.name}`);
    const val = document.getElementById(`hand-${handIdx}-fv-${f.name}`);
    if (bar) bar.style.height = `${Math.round(f.flexion * 100)}%`;
    if (val) animateTextChange(val, f.flexion.toFixed(1));
  });
}

// ─── Canvas skeleton renderer ─────────────────────────────────────────────
function drawSkeleton(canvas, landmarks, present) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  if (!present || !landmarks || landmarks.length < 21) {
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#2a2a2a';
    ctx.font = '12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('No hand detected', W / 2, H / 2);
    return;
  }

  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);

  // Bones
  ctx.strokeStyle = BONE_COLOR;
  ctx.lineWidth = 2;
  HAND_CONNECTIONS.forEach(([a, b]) => {
    const la = landmarks[a], lb = landmarks[b];
    if (!la || !lb) return;
    ctx.beginPath();
    ctx.moveTo(la.tip_x * W, la.tip_y * H);
    ctx.lineTo(lb.tip_x * W, lb.tip_y * H);
    ctx.stroke();
  });

  // Joints
  landmarks.forEach((lm, i) => {
    const isTip = [4, 8, 12, 16, 20].includes(i);
    ctx.beginPath();
    ctx.arc(lm.tip_x * W, lm.tip_y * H, isTip ? 5 : 3, 0, Math.PI * 2);
    ctx.fillStyle = isTip ? '#fff' : LANDMARK_COLOR;
    ctx.fill();
  });
}

// Extend landmarks array with wrist at index 0 for canvas rendering
function buildLandmarksForCanvas(hand) {
  // fingers array only has tip positions; for full skeleton we need all 21 landmarks
  // We reconstruct a minimal list using finger tip positions + wrist
  // (Full landmark data could be added to GestureFrame in a future enhancement)
  // For now render wrist + 5 fingertips as a simplified skeleton
  const pts = [];
  // Wrist at index 0
  pts[0] = { tip_x: hand.wrist_x, tip_y: 1.0 - hand.wrist_y };
  hand.fingers.forEach((f, i) => {
    const tipIdx = [4, 8, 12, 16, 20][i];
    pts[tipIdx] = { tip_x: f.tip_x, tip_y: f.tip_y };
  });
  return pts;
}

// ─── Update UI from frame data ────────────────────────────────────────────
function updateHand(hand) {
  const idx = hand.hand_index;
  const card = document.getElementById(`hand-${idx}`);
  if (!card) return;

  const label = document.getElementById(`hand-${idx}-label`);
  if (label) {
    label.textContent = hand.present ? hand.handedness : 'Not detected';
    label.style.color = hand.present ? '#00d4aa' : '#555';
  }

  const canvas = document.getElementById(`hand-${idx}-canvas`);
  if (canvas) drawSkeleton(canvas, buildLandmarksForCanvas(hand), hand.present);

  const gesture = document.getElementById(`hand-${idx}-gesture`);
  if (gesture) {
    const nextGesture = hand.present ? hand.discrete_gesture : '—';
    if (gesture.textContent !== nextGesture) {
      gesture.textContent = nextGesture;
      // Play sound on gesture change if it's a valid gesture
      if (hand.present && nextGesture !== '—') {
        const prevGesture = lastGesturePerHand[`hand_${idx}`];
        if (prevGesture !== hand.discrete_gesture) {
          playGestureSound(idx, hand.discrete_gesture);
          lastGesturePerHand[`hand_${idx}`] = hand.discrete_gesture;
        }
      }
      gesture.classList.remove('flash');
      void gesture.offsetWidth;
      gesture.classList.add('flash');
    }
    gesture.style.color = hand.present ? '#00d4aa' : '#333';
  }

  // Track gesture for next update
  if (hand.present) {
    lastGesturePerHand[`hand_${idx}`] = hand.discrete_gesture;
  } else {
    delete lastGesturePerHand[`hand_${idx}`];
  }

  // Metric bars
  [
    ['pinch', hand.pinch, 1],
    ['openness', hand.openness, 1],
    ['velocity_x', Math.abs(hand.velocity_x), 3],
    ['velocity_y', Math.abs(hand.velocity_y), 3],
  ].forEach(([key, raw, scale]) => {
    const pct = Math.min(100, Math.abs(raw / scale) * 100);
    const bar = document.getElementById(`hand-${idx}-bar-${key}`);
    const val = document.getElementById(`hand-${idx}-val-${key}`);
    if (bar) bar.style.width = `${pct}%`;
    if (val) animateTextChange(val, raw.toFixed(2));
  });

  // Fingers
  if (hand.fingers) createFingerBars(idx, hand.fingers);

  // Palm orientation
  ['roll', 'pitch', 'yaw'].forEach(axis => {
    const el = document.getElementById(`hand-${idx}-palm-${axis}`);
    if (el) animateTextChange(el, (hand[`palm_${axis}`] || 0).toFixed(2));
  });
}

function onFrame(frame) {
  frameCount++;
  const now = performance.now();
  fpsBuffer.push(now);
  fpsBuffer = fpsBuffer.filter(t => now - t < 2000);
  const fps = (fpsBuffer.length / 2).toFixed(1);

  fpsDisplay.textContent = `${fps} fps`;
  latencyDisplay.textContent = `${frame.latency_ms.toFixed(1)} ms`;

  animateTextChange(document.getElementById('stat-frames'), frameCount);
  animateTextChange(document.getElementById('stat-latency'), `${frame.latency_ms.toFixed(0)} ms`);
  animateTextChange(document.getElementById('stat-fps'), fps);

  const present = frame.hands.filter(h => h.present).length;
  animateTextChange(document.getElementById('stat-hands'), present);

  frame.hands.forEach(hand => updateHand(hand));
}

// ─── Ensure hand cards exist ─────────────────────────────────────────────
function ensureHandCards(numHands) {
  for (let i = 0; i < numHands; i++) {
    if (!document.getElementById(`hand-${i}`)) {
      container.appendChild(createHandCard(i));
    }
  }
}

// ─── WebSocket ───────────────────────────────────────────────────────────
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => {
    statusDot.className = 'connected';
    statusText.textContent = 'Connected';
    initAudio();
    // Keepalive ping every 10s
    setInterval(() => { if (ws.readyState === WebSocket.OPEN) ws.send('ping'); }, 10000);
  };

  ws.onmessage = (e) => {
    try {
      const frame = JSON.parse(e.data);
      ensureHandCards(frame.hands.length);
      onFrame(frame);
    } catch (err) {
      console.warn('Parse error:', err);
    }
  };

  ws.onclose = () => {
    statusDot.className = 'disconnected';
    statusText.textContent = 'Reconnecting...';
    setTimeout(connect, 2000);
  };

  ws.onerror = () => {
    statusDot.className = 'disconnected';
    statusText.textContent = 'Connection error';
  };
}

// ─── Boot ─────────────────────────────────────────────────────────────────
ensureHandCards(2);
if (audioEnableBtn) {
  audioEnableBtn.addEventListener('click', enableSound);
}
connect();
</script>
</body>
</html>
