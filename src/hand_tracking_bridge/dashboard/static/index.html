<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hand Tracking Bridge — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #03050e;
      --surface: rgba(255,255,255,0.05);
      --border:  rgba(255,255,255,0.09);
      --accent:  #7c5aff;
      --cyan:    #00d4ff;
      --green:   #4ade80;
      --yellow:  #fbbf24;
      --danger:  #ff4466;
      --text:    #e8eaf0;
      --muted:   #4a4e6a;
      --glass:   blur(18px) saturate(160%);
      --r:       10px;
      --nav-h:   48px;
      --font:    'Inter', sans-serif;
      --fhead:   'Space Grotesk', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      padding-top: var(--nav-h);
    }

    /* ── Shared Nav ── */
    #nav {
      position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h); z-index: 200;
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
      background: rgba(3,5,14,0.82); backdrop-filter: var(--glass);
      border-bottom: 1px solid var(--border);
    }
    #nav .logo { font-family: var(--fhead); font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
    #nav .logo span { color: var(--cyan); }

    .nav-tabs { display: flex; gap: 4px; }
    .nav-tab {
      background: none; border: 1px solid transparent; color: var(--muted);
      font-family: var(--font); font-size: 13px; font-weight: 500;
      padding: 5px 16px; border-radius: 20px; cursor: pointer; text-decoration: none;
      transition: all 0.18s; display: flex; align-items: center;
    }
    .nav-tab:hover  { color: var(--text); border-color: var(--border); }
    .nav-tab.active { color: var(--text); background: var(--surface); border-color: var(--border); }

    .nav-right { display: flex; align-items: center; gap: 14px; }

    #ws-dot { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--muted); }
    #ws-dot .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); transition: background .4s; }
    #ws-dot.connected    .dot { background: var(--green); box-shadow: 0 0 6px #4ade8088; }
    #ws-dot.disconnected .dot { background: var(--danger); }

    #sound-toggle {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      font-family: var(--font); font-size: 12px; font-weight: 500;
      padding: 5px 14px; border-radius: 20px; cursor: pointer; transition: all .2s;
    }
    #sound-toggle.active { color: var(--cyan); border-color: var(--cyan); background: rgba(0,212,255,0.08); }

    /* ── Layout ── */
    .page { padding: 20px 24px 32px; }

    .stats-bar {
      display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .stat-chip {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
      padding: 8px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 100px;
    }
    .stat-chip .sc-lbl { font-size: 9px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
    .stat-chip .sc-val { font-family: var(--fhead); font-size: 20px; font-weight: 700; color: var(--text); }

    .hands-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

    /* ── Cards ── */
    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 18px;
      backdrop-filter: blur(8px);
    }
    .card-title {
      font-size: 9px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
    }
    .card-title .badge {
      font-size: 10px; font-weight: 600; letter-spacing: 1px;
      padding: 2px 8px; border-radius: 20px;
      background: rgba(124,90,255,0.15); color: var(--accent);
    }
    .card-title .badge.cyan  { background: rgba(0,212,255,0.12); color: var(--cyan); }
    .card-title .badge.green { background: rgba(74,222,128,0.12); color: var(--green); }

    /* ── Skeleton canvas ── */
    .skeleton-wrap {
      width: 100%; aspect-ratio: 4/3;
      background: rgba(0,0,0,0.4); border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden; margin-bottom: 14px;
    }
    .skeleton-wrap canvas { width: 100%; height: 100%; display: block; }

    /* ── Gesture label ── */
    .gesture-lbl {
      text-align: center; font-family: var(--fhead);
      font-size: 22px; font-weight: 700; letter-spacing: 1px;
      color: var(--accent); min-height: 2rem; margin-bottom: 14px;
      text-shadow: 0 0 20px rgba(124,90,255,0.4);
    }

    /* ── Metric bars ── */
    .metrics { display: flex; flex-direction: column; gap: 9px; }
    .metric-row { display: flex; align-items: center; gap: 10px; }
    .metric-name { width: 76px; font-size: 11px; color: var(--muted); flex-shrink: 0; }
    .bar-bg { flex: 1; height: 5px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 3px; transition: width .06s; min-width: 2px; background: var(--accent); }
    .bar-fill.cyan   { background: var(--cyan); }
    .bar-fill.yellow { background: var(--yellow); }
    .metric-val { width: 38px; text-align: right; font-family: var(--fhead); font-size: 11px; color: var(--text); }

    /* ── Finger bars ── */
    .section-label {
      font-size: 9px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      color: var(--muted); margin: 14px 0 10px;
    }
    .finger-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .finger-box { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .finger-name { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .finger-bar-bg {
      width: 20px; height: 70px; background: rgba(255,255,255,0.04);
      border: 1px solid var(--border); border-radius: 4px;
      display: flex; align-items: flex-end; overflow: hidden;
    }
    .finger-bar-fill { width: 100%; background: var(--accent); transition: height .06s; border-radius: 3px; }
    .finger-val { font-size: 10px; color: var(--muted); font-family: var(--fhead); }

    /* ── Palm orientation ── */
    .palm-row { display: flex; justify-content: space-around; margin-top: 4px; }
    .palm-axis { text-align: center; }
    .palm-axis .ax-lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .palm-axis .ax-val { font-family: var(--fhead); font-size: 14px; font-weight: 600; color: var(--yellow); margin-top: 2px; }

    /* ── Bottom row: pipeline + sound ── */
    .bottom-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }

    .stats-mini { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-box {
      background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 14px; text-align: center;
    }
    .stat-box .sb-lbl { font-size: 9px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .stat-box .sb-val { font-family: var(--fhead); font-size: 22px; font-weight: 700; color: var(--text); }

    /* ── Scope ── */
    #scope-canvas {
      width: 100%; height: 72px; display: block;
      background: rgba(0,0,0,0.35); border: 1px solid var(--border);
      border-radius: 8px; margin-bottom: 12px;
    }

    .sound-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  </style>
</head>
<body>

<!-- ── Shared Nav ── -->
<nav id="nav">
  <div class="logo">◎ <span>HAND</span> TRACKING</div>
  <div class="nav-tabs">
    <a class="nav-tab active" href="/">Dashboard</a>
    <a class="nav-tab" href="/void">Particle Void</a>
  </div>
  <div class="nav-right">
    <div id="ws-dot" class="disconnected">
      <div class="dot"></div>
      <span id="status-text">Connecting</span>
      <span id="fps-display" style="color:var(--text);margin-left:6px;"></span>
      <span id="latency-display" style="color:var(--muted);margin-left:4px;"></span>
    </div>
    <button id="sound-toggle">♪ Sound off</button>
  </div>
</nav>

<!-- ── Page content ── -->
<div class="page">

  <!-- Stats bar -->
  <div class="stats-bar">
    <div class="stat-chip"><div class="sc-lbl">Frames</div><div class="sc-val" id="stat-frames">0</div></div>
    <div class="stat-chip"><div class="sc-lbl">FPS</div><div class="sc-val" id="stat-fps">0</div></div>
    <div class="stat-chip"><div class="sc-lbl">Latency</div><div class="sc-val" id="stat-latency">— ms</div></div>
    <div class="stat-chip"><div class="sc-lbl">Hands</div><div class="sc-val" id="stat-hands">0</div></div>
  </div>

  <!-- Hand cards -->
  <div class="hands-grid" id="hands-container"></div>

  <!-- Bottom row -->
  <div class="bottom-grid">

    <div class="card">
      <div class="card-title">Pipeline Stats</div>
      <div class="stats-mini">
        <div class="stat-box"><div class="sb-lbl">Frames</div><div class="sb-val" id="stat-frames2">0</div></div>
        <div class="stat-box"><div class="sb-lbl">Latency</div><div class="sb-val" id="stat-latency2">—</div></div>
        <div class="stat-box"><div class="sb-lbl">Hands</div><div class="sb-val" id="stat-hands2">0</div></div>
        <div class="stat-box"><div class="sb-lbl">FPS</div><div class="sb-val" id="stat-fps2">0</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">
        Sound Synth
        <span id="sound-state" class="badge">off</span>
      </div>
      <canvas id="scope-canvas" width="600" height="72"></canvas>
      <div class="sound-row">
        <div class="stat-box"><div class="sb-lbl">Note</div><div class="sb-val" id="sound-note">—</div></div>
        <div class="stat-box"><div class="sb-lbl">Wave</div><div class="sb-val" id="sound-wave" style="font-size:14px">—</div></div>
      </div>
      <div class="metrics">
        <div class="metric-row">
          <span class="metric-name">Volume</span>
          <div class="bar-bg"><div class="bar-fill cyan" id="sound-bar-vol" style="width:0%"></div></div>
          <span class="metric-val" id="sound-val-vol">0.00</span>
        </div>
        <div class="metric-row">
          <span class="metric-name">Vibrato</span>
          <div class="bar-bg"><div class="bar-fill yellow" id="sound-bar-vib" style="width:0%"></div></div>
          <span class="metric-val" id="sound-val-vib">0.00</span>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
// ─── MediaPipe connections ────────────────────────────────────────────────────
// Points: 0=wrist  1-5=estimated knuckles (wrist→tip midpoints)  6-10=tips (thumb→pinky)
const HAND_CONNECTIONS = [
  [0,1],[1,6],          // thumb
  [0,2],[2,7],          // index
  [0,3],[3,8],          // middle
  [0,4],[4,9],          // ring
  [0,5],[5,10],         // pinky
  [2,3],[3,4],[4,5],    // palm knuckle arc
];

// ─── State ────────────────────────────────────────────────────────────────────
let ws = null;
let frameCount = 0;
let fpsBuffer = [];

// ─── DOM refs ─────────────────────────────────────────────────────────────────
const container  = document.getElementById('hands-container');
const wsDot      = document.getElementById('ws-dot');
const statusText = document.getElementById('status-text');
const fpsDisplay = document.getElementById('fps-display');
const latDisplay = document.getElementById('latency-display');

// ─── Hand card builder ────────────────────────────────────────────────────────
function createHandCard(idx) {
  const card = document.createElement('div');
  card.className = 'card';
  card.id = `hand-${idx}`;
  card.innerHTML = `
    <div class="card-title">
      Hand ${idx}
      <span id="hand-${idx}-badge" class="badge">Not detected</span>
    </div>
    <div class="skeleton-wrap">
      <canvas id="hand-${idx}-canvas" width="320" height="240"></canvas>
    </div>
    <div class="gesture-lbl" id="hand-${idx}-gesture">—</div>
    <div class="metrics">
      ${['pinch','openness','velocity_x','velocity_y'].map(k => `
        <div class="metric-row">
          <span class="metric-name">${k}</span>
          <div class="bar-bg"><div class="bar-fill ${k.startsWith('velocity') ? 'yellow' : 'cyan'}" id="hand-${idx}-bar-${k}" style="width:0%"></div></div>
          <span class="metric-val" id="hand-${idx}-val-${k}">0.00</span>
        </div>`).join('')}
    </div>
    <div class="section-label">Finger Flexion</div>
    <div class="finger-grid" id="hand-${idx}-fingers"></div>
    <div class="section-label">Palm Orientation</div>
    <div class="palm-row">
      ${['roll','pitch','yaw'].map(a => `
        <div class="palm-axis">
          <div class="ax-lbl">${a}</div>
          <div class="ax-val" id="hand-${idx}-palm-${a}">0.00</div>
        </div>`).join('')}
    </div>
  `;
  return card;
}

function createFingerBars(handIdx, fingers) {
  const wrap = document.getElementById(`hand-${handIdx}-fingers`);
  if (!wrap) return;
  if (wrap.children.length === 0) {
    fingers.forEach(f => {
      wrap.innerHTML += `
        <div class="finger-box">
          <div class="finger-bar-bg">
            <div class="finger-bar-fill" id="hand-${handIdx}-ff-${f.name}" style="height:0%"></div>
          </div>
          <div class="finger-name">${f.name.slice(0,3)}</div>
          <div class="finger-val" id="hand-${handIdx}-fv-${f.name}">0.0</div>
        </div>`;
    });
  }
  fingers.forEach(f => {
    const bar = document.getElementById(`hand-${handIdx}-ff-${f.name}`);
    const val = document.getElementById(`hand-${handIdx}-fv-${f.name}`);
    if (bar) bar.style.height = `${Math.round(f.flexion * 100)}%`;
    if (val) val.textContent = f.flexion.toFixed(1);
  });
}

// ─── Skeleton renderer ────────────────────────────────────────────────────────
function drawSkeleton(canvas, landmarks, present) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  if (!present || !landmarks || landmarks.length < 11) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.font = '13px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('No hand detected', W / 2, H / 2);
    return;
  }

  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);

  // Bones
  ctx.strokeStyle = 'rgba(124,90,255,0.35)';
  ctx.lineWidth = 2;
  HAND_CONNECTIONS.forEach(([a, b]) => {
    const la = landmarks[a], lb = landmarks[b];
    if (!la || !lb) return;
    ctx.beginPath();
    ctx.moveTo(la.tip_x * W, la.tip_y * H);
    ctx.lineTo(lb.tip_x * W, lb.tip_y * H);
    ctx.stroke();
  });

  // Joints
  landmarks.forEach((lm, i) => {
    if (!lm) return;
    const isTip = i >= 6;
    ctx.beginPath();
    ctx.arc(lm.tip_x * W, lm.tip_y * H, isTip ? 5 : 3, 0, Math.PI * 2);
    ctx.fillStyle = isTip ? '#00d4ff' : '#7c5aff';
    ctx.fill();
  });
}

function buildLandmarks(hand) {
  // 0: wrist | 1-5: estimated knuckles at 50% wrist→tip | 6-10: finger tips
  const wx = hand.wrist_x;
  const wy = 1.0 - hand.wrist_y;
  const pts = [{ tip_x: wx, tip_y: wy }];
  hand.fingers.forEach(f => {
    const tx = f.tip_x, ty = 1.0 - f.tip_y;
    pts.push({ tip_x: (wx + tx) * 0.5, tip_y: (wy + ty) * 0.5 }); // knuckles 1-5
  });
  hand.fingers.forEach(f => {
    pts.push({ tip_x: f.tip_x, tip_y: 1.0 - f.tip_y }); // tips 6-10
  });
  return pts; // length 11, dense, all Y-inverted consistently
}

// ─── Update hand from frame ───────────────────────────────────────────────────
function updateHand(hand) {
  const idx = hand.hand_index;
  if (!document.getElementById(`hand-${idx}`)) return;

  const badge = document.getElementById(`hand-${idx}-badge`);
  if (badge) {
    badge.textContent  = hand.present ? hand.handedness : 'Not detected';
    badge.className    = hand.present ? 'badge green' : 'badge';
  }

  const canvas = document.getElementById(`hand-${idx}-canvas`);
  if (canvas) drawSkeleton(canvas, buildLandmarks(hand), hand.present);

  const gestEl = document.getElementById(`hand-${idx}-gesture`);
  if (gestEl) {
    gestEl.textContent = hand.present ? (hand.discrete_gesture || '—') : '—';
    gestEl.style.color = hand.present ? 'var(--accent)' : 'var(--muted)';
  }

  [
    ['pinch', hand.pinch, 1],
    ['openness', hand.openness, 1],
    ['velocity_x', Math.abs(hand.velocity_x), 3],
    ['velocity_y', Math.abs(hand.velocity_y), 3],
  ].forEach(([key, raw, scale]) => {
    const pct = Math.min(100, Math.abs(raw / scale) * 100);
    const bar = document.getElementById(`hand-${idx}-bar-${key}`);
    const val = document.getElementById(`hand-${idx}-val-${key}`);
    if (bar) bar.style.width = `${pct}%`;
    if (val) val.textContent = raw.toFixed(2);
  });

  if (hand.fingers) createFingerBars(idx, hand.fingers);

  ['roll','pitch','yaw'].forEach(a => {
    const el = document.getElementById(`hand-${idx}-palm-${a}`);
    if (el) el.textContent = (hand[`palm_${a}`] || 0).toFixed(2);
  });
}

function onFrame(frame) {
  frameCount++;
  const now = performance.now();
  fpsBuffer.push(now);
  fpsBuffer = fpsBuffer.filter(t => now - t < 2000);
  const fps = (fpsBuffer.length / 2).toFixed(1);

  fpsDisplay.textContent = `${fps} fps`;
  latDisplay.textContent  = `${frame.latency_ms.toFixed(0)} ms`;

  ['stat-frames','stat-frames2'].forEach(id => { const e = document.getElementById(id); if(e) e.textContent = frameCount; });
  ['stat-fps','stat-fps2'].forEach(id => { const e = document.getElementById(id); if(e) e.textContent = fps; });
  ['stat-latency','stat-latency2'].forEach(id => { const e = document.getElementById(id); if(e) e.textContent = frame.latency_ms.toFixed(0) + ' ms'; });

  const present = frame.hands.filter(h => h.present).length;
  ['stat-hands','stat-hands2'].forEach(id => { const e = document.getElementById(id); if(e) e.textContent = present; });

  frame.hands.forEach(hand => updateHand(hand));
  updateSynth(frame);
}

function ensureHandCards(n) {
  for (let i = 0; i < n; i++) {
    if (!document.getElementById(`hand-${i}`)) container.appendChild(createHandCard(i));
  }
}

// ─── WebSocket ────────────────────────────────────────────────────────────────
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => {
    wsDot.className = 'connected';
    statusText.textContent = 'Connected';
    setInterval(() => { if (ws.readyState === WebSocket.OPEN) ws.send('ping'); }, 10000);
  };
  ws.onmessage = e => {
    try {
      const frame = JSON.parse(e.data);
      ensureHandCards(frame.hands.length);
      onFrame(frame);
    } catch(err) { console.warn('Parse error:', err); }
  };
  ws.onclose = () => {
    wsDot.className = 'disconnected';
    statusText.textContent = 'Reconnecting...';
    setTimeout(connect, 2000);
  };
  ws.onerror = () => {
    wsDot.className = 'disconnected';
    statusText.textContent = 'Error';
  };
}

ensureHandCards(2);
connect();

// ─── Web Audio Synth ──────────────────────────────────────────────────────────
const PENTATONIC = [0,3,5,7,10,12,15,17,19,22,24];
const BASE_FREQ  = 220.0;
const NOTE_NAMES = ['A','A#','B','C','C#','D','D#','E','F','F#','G','G#'];
const GESTURE_WAVE = { open:'sine', fist:'sawtooth', peace:'square', thumbs_up:'triangle', pointing:'sine', none:'sine' };

let audioCtx=null, mainOsc=null, gainNode=null, lfoOsc=null, lfoGain=null, analyser=null;
let soundEnabled=false, scopeAnimId=null;

function semHz(n) { return BASE_FREQ * Math.pow(2, n/12); }
function semName(n) { const m=57+n; return NOTE_NAMES[m%12]+(Math.floor(m/12)-1); }
function pentatonicFreq(x, shift) {
  const i = Math.max(0, Math.min(PENTATONIC.length-1, Math.round(x*(PENTATONIC.length-1))));
  const s = PENTATONIC[i] + shift*12;
  return { hz: semHz(s), name: semName(s) };
}

function buildAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser(); analyser.fftSize = 1024;
  gainNode = audioCtx.createGain(); gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
  lfoOsc   = audioCtx.createOscillator(); lfoOsc.type = 'sine'; lfoOsc.frequency.value = 5;
  lfoGain  = audioCtx.createGain(); lfoGain.gain.value = 0;
  mainOsc  = audioCtx.createOscillator(); mainOsc.type = 'sine'; mainOsc.frequency.value = BASE_FREQ;
  lfoOsc.connect(lfoGain); lfoGain.connect(mainOsc.frequency);
  mainOsc.connect(gainNode); gainNode.connect(analyser); analyser.connect(audioCtx.destination);
  mainOsc.start(); lfoOsc.start();
}

function updateSynth(frame) {
  if (!soundEnabled || !audioCtx) return;
  let hand = null;
  for (const h of frame.hands) { if (h.present) { if (h.handedness==='Right'){hand=h;break;} hand=h; } }
  const now = audioCtx.currentTime, ramp = 0.05;
  if (!hand) {
    gainNode.gain.linearRampToValueAtTime(0, now+ramp);
    document.getElementById('sound-state').textContent = 'waiting...';
    return;
  }
  const { hz, name } = pentatonicFreq(hand.wrist_x, hand.pinch>0.7?1:0);
  const muted  = hand.discrete_gesture === 'pointing';
  const volume = muted ? 0 : Math.min(0.75, hand.wrist_y*1.2);
  const vibrato = hand.openness * 30;
  const wave = GESTURE_WAVE[hand.discrete_gesture] || 'sine';
  if (mainOsc.type !== wave) mainOsc.type = wave;
  mainOsc.frequency.linearRampToValueAtTime(hz, now+ramp);
  gainNode.gain.linearRampToValueAtTime(volume, now+ramp);
  lfoGain.gain.linearRampToValueAtTime(vibrato, now+ramp);
  document.getElementById('sound-note').textContent = muted ? 'MUTE' : name;
  document.getElementById('sound-wave').textContent = muted ? '—' : wave;
  document.getElementById('sound-state').textContent = muted ? 'muted' : 'active';
  document.getElementById('sound-state').className = muted ? 'badge' : 'badge cyan';
  document.getElementById('sound-bar-vol').style.width = `${Math.min(100,volume/0.75*100)}%`;
  document.getElementById('sound-val-vol').textContent  = volume.toFixed(2);
  document.getElementById('sound-bar-vib').style.width  = `${Math.min(100,vibrato/30*100)}%`;
  document.getElementById('sound-val-vib').textContent  = hand.openness.toFixed(2);
}

function drawScope() {
  scopeAnimId = requestAnimationFrame(drawScope);
  const cv = document.getElementById('scope-canvas');
  if (!cv || !analyser) return;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const buf = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = 'rgba(124,90,255,0.75)'; ctx.lineWidth = 1.5; ctx.beginPath();
  const step = W / buf.length;
  buf.forEach((v,i) => { const y=(1-(v*0.5+0.5))*H; i===0?ctx.moveTo(0,y):ctx.lineTo(i*step,y); });
  ctx.stroke();
}

document.getElementById('sound-toggle').addEventListener('click', () => {
  if (!soundEnabled) {
    buildAudio(); soundEnabled = true;
    document.getElementById('sound-toggle').textContent = '♪ Sound on';
    document.getElementById('sound-toggle').classList.add('active');
    document.getElementById('sound-state').textContent = 'waiting...';
    document.getElementById('sound-state').className = 'badge';
    drawScope();
  } else {
    soundEnabled = false;
    if (audioCtx) { audioCtx.close(); audioCtx=null; }
    if (scopeAnimId) { cancelAnimationFrame(scopeAnimId); scopeAnimId=null; }
    mainOsc=gainNode=lfoOsc=lfoGain=analyser=null;
    document.getElementById('sound-toggle').textContent = '♪ Sound off';
    document.getElementById('sound-toggle').classList.remove('active');
    document.getElementById('sound-state').textContent = 'off';
    document.getElementById('sound-state').className = 'badge';
    document.getElementById('sound-note').textContent = '—';
    document.getElementById('sound-wave').textContent = '—';
    const cv = document.getElementById('scope-canvas');
    if (cv) { const c=cv.getContext('2d'); c.fillStyle='rgba(0,0,0,0.5)'; c.fillRect(0,0,cv.width,cv.height); }
  }
});
</script>
