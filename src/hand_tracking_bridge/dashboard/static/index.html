<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hand Tracking Bridge — Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      padding: 16px;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      border-bottom: 1px solid #333;
      padding-bottom: 12px;
    }

    header h1 { font-size: 1.2rem; color: #00d4aa; letter-spacing: 2px; text-transform: uppercase; }

    #status {
      display: flex; align-items: center; gap: 8px; font-size: 0.8rem;
    }
    #status-dot {
      width: 10px; height: 10px; border-radius: 50%; background: #555;
      transition: background 0.3s;
    }
    #status-dot.connected { background: #00d4aa; }
    #status-dot.disconnected { background: #ff4444; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 16px;
    }

    .card {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 16px;
    }

    .card h2 {
      font-size: 0.85rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }

    canvas {
      width: 100%;
      aspect-ratio: 4/3;
      background: #0a0a0a;
      border-radius: 4px;
      display: block;
    }

    .gesture-label {
      text-align: center;
      font-size: 1.6rem;
      font-weight: bold;
      color: #00d4aa;
      min-height: 2.4rem;
      margin-top: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .metrics { display: flex; flex-direction: column; gap: 10px; }

    .metric-row { display: flex; align-items: center; gap: 10px; font-size: 0.82rem; }
    .metric-name { width: 80px; color: #888; flex-shrink: 0; }
    .bar-bg {
      flex: 1;
      height: 14px;
      background: #222;
      border-radius: 7px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: #00d4aa;
      border-radius: 7px;
      transition: width 0.05s linear;
      min-width: 2px;
    }
    .bar-fill.red { background: #ff4c4c; }
    .bar-fill.yellow { background: #f0c040; }
    .metric-value { width: 40px; text-align: right; font-size: 0.75rem; color: #aaa; }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat-box {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 10px 12px;
      text-align: center;
    }
    .stat-label { font-size: 0.7rem; color: #666; text-transform: uppercase; margin-bottom: 4px; }
    .stat-value { font-size: 1.1rem; color: #fff; font-weight: bold; }

    .finger-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 4px;
    }
    .finger-box {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .finger-name { font-size: 0.6rem; color: #666; text-transform: uppercase; }
    .finger-bar-bg {
      width: 24px; height: 80px;
      background: #1a1a1a;
      border-radius: 4px;
      display: flex; align-items: flex-end;
      overflow: hidden;
      border: 1px solid #2a2a2a;
    }
    .finger-bar-fill {
      width: 100%;
      background: #7b61ff;
      transition: height 0.05s linear;
      border-radius: 3px;
    }
    .finger-val { font-size: 0.65rem; color: #888; }

    .palm-display {
      display: flex; justify-content: space-around; margin-top: 8px;
    }
    .palm-axis { text-align: center; }
    .palm-axis .axis-label { font-size: 0.65rem; color: #666; text-transform: uppercase; }
    .palm-axis .axis-val { font-size: 0.9rem; color: #f0c040; }

    footer {
      margin-top: 20px;
      text-align: center;
      font-size: 0.7rem;
      color: #444;
    }

    #sound-toggle {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #888;
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: border-color 0.2s, color 0.2s;
    }
    #sound-toggle.active {
      border-color: #00d4aa;
      color: #00d4aa;
    }

    #scope-canvas {
      width: 100%;
      height: 80px;
      background: #0a0a0a;
      border-radius: 4px;
      display: block;
      margin-bottom: 10px;
    }

    .sound-params {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<header>
  <h1>Hand Tracking Bridge</h1>
  <div id="status">
    <div id="status-dot" class="disconnected"></div>
    <span id="status-text">Disconnected</span>
    &nbsp;|&nbsp;
    <span id="fps-display">0 fps</span>
    &nbsp;|&nbsp;
    <span id="latency-display">0 ms</span>
    &nbsp;|&nbsp;
    <button id="sound-toggle">♪ SOUND OFF</button>
  </div>
</header>

<div class="grid" id="hands-container">
  <!-- Hand cards injected by JS -->
</div>

<div style="margin-top:16px;" class="grid">
  <div class="card">
    <h2>Pipeline Stats</h2>
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Frames</div>
        <div class="stat-value" id="stat-frames">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Latency</div>
        <div class="stat-value" id="stat-latency">— ms</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Hands</div>
        <div class="stat-value" id="stat-hands">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">FPS</div>
        <div class="stat-value" id="stat-fps">0</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Sound Synth <span id="sound-state" style="color:#555;font-size:0.7rem;margin-left:6px;">off — click ♪ SOUND OFF to enable</span></h2>
    <canvas id="scope-canvas" width="600" height="80"></canvas>
    <div class="sound-params">
      <div class="stat-box">
        <div class="stat-label">Note</div>
        <div class="stat-value" id="sound-note">—</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Wave</div>
        <div class="stat-value" id="sound-wave">—</div>
      </div>
    </div>
    <div class="metrics" style="margin-top:10px;">
      <div class="metric-row">
        <span class="metric-name">volume</span>
        <div class="bar-bg"><div class="bar-fill" id="sound-bar-vol" style="width:0%"></div></div>
        <span class="metric-value" id="sound-val-vol">0.00</span>
      </div>
      <div class="metric-row">
        <span class="metric-name">vibrato</span>
        <div class="bar-bg"><div class="bar-fill yellow" id="sound-bar-vib" style="width:0%"></div></div>
        <span class="metric-value" id="sound-val-vib">0.00</span>
      </div>
    </div>
  </div>
</div>

<footer>Hand Tracking Bridge v2 &mdash; MediaPipe + OSC + WebSocket</footer>

<script>
// ─── MediaPipe hand connection pairs ────────────────────────────────────────
const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],     // Thumb
  [0,5],[5,6],[6,7],[7,8],     // Index
  [0,9],[9,10],[10,11],[11,12],// Middle
  [0,13],[13,14],[14,15],[15,16],// Ring
  [0,17],[17,18],[18,19],[19,20],// Pinky
  [5,9],[9,13],[13,17]         // Palm
];

const LANDMARK_COLOR = '#00d4aa';
const BONE_COLOR = 'rgba(0, 212, 170, 0.4)';
const ABSENT_COLOR = '#2a2a2a';

// ─── State ───────────────────────────────────────────────────────────────────
let ws = null;
let frameCount = 0;
let lastFrameTime = performance.now();
let fpsBuffer = [];

// ─── DOM ─────────────────────────────────────────────────────────────────────
const container = document.getElementById('hands-container');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const fpsDisplay = document.getElementById('fps-display');
const latencyDisplay = document.getElementById('latency-display');

// ─── Hand card builder ───────────────────────────────────────────────────────
function createHandCard(idx) {
  const card = document.createElement('div');
  card.className = 'card';
  card.id = `hand-${idx}`;
  card.innerHTML = `
    <h2>Hand ${idx} <span id="hand-${idx}-label" style="color:#555;font-size:0.7rem;margin-left:8px;">Not detected</span></h2>
    <canvas id="hand-${idx}-canvas" width="320" height="240"></canvas>
    <div class="gesture-label" id="hand-${idx}-gesture">—</div>
    <div class="metrics" style="margin-top:14px;">
      ${['pinch','openness','velocity_x','velocity_y'].map(k => `
        <div class="metric-row">
          <span class="metric-name">${k}</span>
          <div class="bar-bg"><div class="bar-fill ${k.startsWith('velocity') ? 'yellow' : ''}" id="hand-${idx}-bar-${k}" style="width:0%"></div></div>
          <span class="metric-value" id="hand-${idx}-val-${k}">0.00</span>
        </div>`).join('')}
    </div>
    <div style="margin-top:14px;">
      <div style="font-size:0.75rem;color:#666;text-transform:uppercase;margin-bottom:8px;">Finger Flexion</div>
      <div class="finger-grid" id="hand-${idx}-fingers"></div>
    </div>
    <div style="margin-top:14px;">
      <div style="font-size:0.75rem;color:#666;text-transform:uppercase;margin-bottom:4px;">Palm Orientation</div>
      <div class="palm-display">
        ${['roll','pitch','yaw'].map(a => `
          <div class="palm-axis">
            <div class="axis-label">${a}</div>
            <div class="axis-val" id="hand-${idx}-palm-${a}">0.00</div>
          </div>`).join('')}
      </div>
    </div>
  `;
  return card;
}

function createFingerBars(handIdx, fingers) {
  const container = document.getElementById(`hand-${handIdx}-fingers`);
  if (!container) return;
  if (container.children.length === 0) {
    fingers.forEach(f => {
      container.innerHTML += `
        <div class="finger-box">
          <div class="finger-bar-bg">
            <div class="finger-bar-fill" id="hand-${handIdx}-ff-${f.name}" style="height:0%"></div>
          </div>
          <div class="finger-name">${f.name.slice(0,3)}</div>
          <div class="finger-val" id="hand-${handIdx}-fv-${f.name}">0.0</div>
        </div>`;
    });
  }
  fingers.forEach(f => {
    const bar = document.getElementById(`hand-${handIdx}-ff-${f.name}`);
    const val = document.getElementById(`hand-${handIdx}-fv-${f.name}`);
    if (bar) bar.style.height = `${Math.round(f.flexion * 100)}%`;
    if (val) val.textContent = f.flexion.toFixed(1);
  });
}

// ─── Canvas skeleton renderer ─────────────────────────────────────────────
function drawSkeleton(canvas, landmarks, present) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  if (!present || !landmarks || landmarks.length < 21) {
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#2a2a2a';
    ctx.font = '12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('No hand detected', W / 2, H / 2);
    return;
  }

  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);

  // Bones
  ctx.strokeStyle = BONE_COLOR;
  ctx.lineWidth = 2;
  HAND_CONNECTIONS.forEach(([a, b]) => {
    const la = landmarks[a], lb = landmarks[b];
    if (!la || !lb) return;
    ctx.beginPath();
    ctx.moveTo(la.tip_x * W, la.tip_y * H);
    ctx.lineTo(lb.tip_x * W, lb.tip_y * H);
    ctx.stroke();
  });

  // Joints
  landmarks.forEach((lm, i) => {
    const isTip = [4, 8, 12, 16, 20].includes(i);
    ctx.beginPath();
    ctx.arc(lm.tip_x * W, lm.tip_y * H, isTip ? 5 : 3, 0, Math.PI * 2);
    ctx.fillStyle = isTip ? '#fff' : LANDMARK_COLOR;
    ctx.fill();
  });
}

// Extend landmarks array with wrist at index 0 for canvas rendering
function buildLandmarksForCanvas(hand) {
  // fingers array only has tip positions; for full skeleton we need all 21 landmarks
  // We reconstruct a minimal list using finger tip positions + wrist
  // (Full landmark data could be added to GestureFrame in a future enhancement)
  // For now render wrist + 5 fingertips as a simplified skeleton
  const pts = [];
  // Wrist at index 0
  pts[0] = { tip_x: hand.wrist_x, tip_y: 1.0 - hand.wrist_y };
  hand.fingers.forEach((f, i) => {
    const tipIdx = [4, 8, 12, 16, 20][i];
    pts[tipIdx] = { tip_x: f.tip_x, tip_y: f.tip_y };
  });
  return pts;
}

// ─── Update UI from frame data ────────────────────────────────────────────
function updateHand(hand) {
  const idx = hand.hand_index;
  const card = document.getElementById(`hand-${idx}`);
  if (!card) return;

  const label = document.getElementById(`hand-${idx}-label`);
  if (label) {
    label.textContent = hand.present ? hand.handedness : 'Not detected';
    label.style.color = hand.present ? '#00d4aa' : '#555';
  }

  const canvas = document.getElementById(`hand-${idx}-canvas`);
  if (canvas) drawSkeleton(canvas, buildLandmarksForCanvas(hand), hand.present);

  const gesture = document.getElementById(`hand-${idx}-gesture`);
  if (gesture) {
    gesture.textContent = hand.present ? hand.discrete_gesture : '—';
    gesture.style.color = hand.present ? '#00d4aa' : '#333';
  }

  // Metric bars
  [
    ['pinch', hand.pinch, 1],
    ['openness', hand.openness, 1],
    ['velocity_x', Math.abs(hand.velocity_x), 3],
    ['velocity_y', Math.abs(hand.velocity_y), 3],
  ].forEach(([key, raw, scale]) => {
    const pct = Math.min(100, Math.abs(raw / scale) * 100);
    const bar = document.getElementById(`hand-${idx}-bar-${key}`);
    const val = document.getElementById(`hand-${idx}-val-${key}`);
    if (bar) bar.style.width = `${pct}%`;
    if (val) val.textContent = raw.toFixed(2);
  });

  // Fingers
  if (hand.fingers) createFingerBars(idx, hand.fingers);

  // Palm orientation
  ['roll', 'pitch', 'yaw'].forEach(axis => {
    const el = document.getElementById(`hand-${idx}-palm-${axis}`);
    if (el) el.textContent = (hand[`palm_${axis}`] || 0).toFixed(2);
  });
}

function onFrame(frame) {
  frameCount++;
  const now = performance.now();
  fpsBuffer.push(now);
  fpsBuffer = fpsBuffer.filter(t => now - t < 2000);
  const fps = (fpsBuffer.length / 2).toFixed(1);

  fpsDisplay.textContent = `${fps} fps`;
  latencyDisplay.textContent = `${frame.latency_ms.toFixed(1)} ms`;

  document.getElementById('stat-frames').textContent = frameCount;
  document.getElementById('stat-latency').textContent = `${frame.latency_ms.toFixed(0)} ms`;
  document.getElementById('stat-fps').textContent = fps;

  const present = frame.hands.filter(h => h.present).length;
  document.getElementById('stat-hands').textContent = present;

  frame.hands.forEach(hand => updateHand(hand));
  updateSynth(frame);
}

// ─── Ensure hand cards exist ─────────────────────────────────────────────
function ensureHandCards(numHands) {
  for (let i = 0; i < numHands; i++) {
    if (!document.getElementById(`hand-${i}`)) {
      container.appendChild(createHandCard(i));
    }
  }
}

// ─── WebSocket ───────────────────────────────────────────────────────────
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => {
    statusDot.className = 'connected';
    statusText.textContent = 'Connected';
    // Keepalive ping every 10s
    setInterval(() => { if (ws.readyState === WebSocket.OPEN) ws.send('ping'); }, 10000);
  };

  ws.onmessage = (e) => {
    try {
      const frame = JSON.parse(e.data);
      ensureHandCards(frame.hands.length);
      onFrame(frame);
    } catch (err) {
      console.warn('Parse error:', err);
    }
  };

  ws.onclose = () => {
    statusDot.className = 'disconnected';
    statusText.textContent = 'Reconnecting...';
    setTimeout(connect, 2000);
  };

  ws.onerror = () => {
    statusDot.className = 'disconnected';
    statusText.textContent = 'Connection error';
  };
}

// ─── Boot ─────────────────────────────────────────────────────────────────
ensureHandCards(2);
connect();

// ─── Web Audio Synth ──────────────────────────────────────────────────────
const PENTATONIC_SEMITONES = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22, 24];
const BASE_FREQ = 220.0; // A3

const NOTE_NAMES = ['A','A#','B','C','C#','D','D#','E','F','F#','G','G#'];
const OCTAVE_BASE = 3; // A3

const GESTURE_WAVE = {
  open:      'sine',
  fist:      'sawtooth',
  peace:     'square',
  thumbs_up: 'triangle',
  pointing:  'sine', // muted via gain
  none:      'sine',
};

function semitoneToHz(n) {
  return BASE_FREQ * Math.pow(2, n / 12);
}

function semitoneToNoteName(n) {
  const midiNote = 57 + n; // A3 = MIDI 57
  const name = NOTE_NAMES[midiNote % 12];
  const octave = Math.floor(midiNote / 12) - 1;
  return `${name}${octave}`;
}

function pentatonicFreq(x, octaveShift) {
  const idx = Math.round(x * (PENTATONIC_SEMITONES.length - 1));
  const clamped = Math.max(0, Math.min(idx, PENTATONIC_SEMITONES.length - 1));
  const semitones = PENTATONIC_SEMITONES[clamped] + octaveShift * 12;
  return { hz: semitoneToHz(semitones), name: semitoneToNoteName(semitones) };
}

let audioCtx = null;
let mainOsc = null;
let gainNode = null;
let lfoOsc = null;
let lfoGain = null;
let analyser = null;
let soundEnabled = false;
let scopeAnimId = null;

function buildAudioGraph() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;

  gainNode = audioCtx.createGain();
  gainNode.gain.setValueAtTime(0, audioCtx.currentTime);

  lfoOsc = audioCtx.createOscillator();
  lfoOsc.type = 'sine';
  lfoOsc.frequency.setValueAtTime(5, audioCtx.currentTime);

  lfoGain = audioCtx.createGain();
  lfoGain.gain.setValueAtTime(0, audioCtx.currentTime);

  mainOsc = audioCtx.createOscillator();
  mainOsc.type = 'sine';
  mainOsc.frequency.setValueAtTime(BASE_FREQ, audioCtx.currentTime);

  lfoOsc.connect(lfoGain);
  lfoGain.connect(mainOsc.frequency);
  mainOsc.connect(gainNode);
  gainNode.connect(analyser);
  analyser.connect(audioCtx.destination);

  mainOsc.start();
  lfoOsc.start();
}

function updateSynth(frame) {
  if (!soundEnabled || !audioCtx) return;

  // Pick the first present hand (prefer Right)
  let hand = null;
  for (const h of frame.hands) {
    if (h.present) {
      if (h.handedness === 'Right') { hand = h; break; }
      hand = h;
    }
  }

  const now = audioCtx.currentTime;
  const ramp = 0.05; // 50ms smooth ramp

  if (!hand) {
    gainNode.gain.linearRampToValueAtTime(0, now + ramp);
    document.getElementById('sound-state').textContent = 'no hand detected';
    return;
  }

  const octaveShift = hand.pinch > 0.7 ? 1 : 0;
  const { hz, name } = pentatonicFreq(hand.wrist_x, octaveShift);

  // Volume: wrist_y (0=bottom quiet, 1=top loud), mute on pointing
  const isMuted = hand.discrete_gesture === 'pointing';
  const volume = isMuted ? 0 : Math.min(0.75, hand.wrist_y * 1.2);

  // Vibrato depth in Hz — openness controls depth (0–30 Hz range)
  const vibratoDepth = hand.openness * 30;

  // Waveform
  const waveType = GESTURE_WAVE[hand.discrete_gesture] || 'sine';
  if (mainOsc.type !== waveType) mainOsc.type = waveType;

  // Apply smooth ramps
  mainOsc.frequency.linearRampToValueAtTime(hz, now + ramp);
  gainNode.gain.linearRampToValueAtTime(volume, now + ramp);
  lfoGain.gain.linearRampToValueAtTime(vibratoDepth, now + ramp);

  // Update sound card UI
  document.getElementById('sound-note').textContent = isMuted ? 'MUTE' : name;
  document.getElementById('sound-wave').textContent = isMuted ? '—' : waveType;
  document.getElementById('sound-state').textContent = isMuted ? 'muted (pointing)' : 'active';

  const volPct = Math.min(100, volume / 0.75 * 100);
  const vibPct = Math.min(100, vibratoDepth / 30 * 100);
  document.getElementById('sound-bar-vol').style.width = `${volPct}%`;
  document.getElementById('sound-val-vol').textContent = volume.toFixed(2);
  document.getElementById('sound-bar-vib').style.width = `${vibPct}%`;
  document.getElementById('sound-val-vib').textContent = hand.openness.toFixed(2);
}

// ─── Oscilloscope ────────────────────────────────────────────────────────
function drawScope() {
  scopeAnimId = requestAnimationFrame(drawScope);
  const canvas = document.getElementById('scope-canvas');
  if (!canvas || !analyser) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const buf = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);

  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = '#00d4aa';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  const step = W / buf.length;
  for (let i = 0; i < buf.length; i++) {
    const x = i * step;
    const y = (1 - (buf[i] * 0.5 + 0.5)) * H;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
}

// ─── Sound toggle button ─────────────────────────────────────────────────
document.getElementById('sound-toggle').addEventListener('click', () => {
  if (!soundEnabled) {
    buildAudioGraph();
    soundEnabled = true;
    document.getElementById('sound-toggle').textContent = '♪ SOUND ON';
    document.getElementById('sound-toggle').classList.add('active');
    document.getElementById('sound-state').textContent = 'waiting for hand...';
    drawScope();
  } else {
    soundEnabled = false;
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    if (scopeAnimId) { cancelAnimationFrame(scopeAnimId); scopeAnimId = null; }
    mainOsc = gainNode = lfoOsc = lfoGain = analyser = null;
    document.getElementById('sound-toggle').textContent = '♪ SOUND OFF';
    document.getElementById('sound-toggle').classList.remove('active');
    document.getElementById('sound-state').textContent = 'off — click ♪ SOUND OFF to enable';
    document.getElementById('sound-note').textContent = '—';
    document.getElementById('sound-wave').textContent = '—';

    // Clear scope
    const canvas = document.getElementById('scope-canvas');
    if (canvas) {
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  }
});
</script>
</body>
</html>
