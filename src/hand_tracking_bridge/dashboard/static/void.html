<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Void — Hand Tracking</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050510; overflow: hidden; font-family: 'Courier New', monospace; }
  canvas { display: block; }

  #hud {
    position: fixed; top: 20px; left: 20px; color: #7af; font-size: 12px;
    pointer-events: none; user-select: none; line-height: 1.8;
  }
  #hud .label { color: #48f; text-transform: uppercase; letter-spacing: 2px; font-size: 10px; }
  #hud .val   { color: #aef; }

  #gesture-flash {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 64px; color: #fff; pointer-events: none; opacity: 0;
    text-shadow: 0 0 40px #88f, 0 0 80px #44f;
    transition: opacity 0.1s;
  }

  #start-overlay {
    position: fixed; inset: 0; background: rgba(5,5,16,0.92);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #aef; cursor: pointer; z-index: 100;
    transition: opacity 0.5s;
  }
  #start-overlay h1 { font-size: 3rem; letter-spacing: 6px; color: #88f;
    text-shadow: 0 0 40px #44f; margin-bottom: 16px; }
  #start-overlay p  { font-size: 1rem; color: #78a; letter-spacing: 2px; }
  #start-overlay .hint { margin-top: 40px; font-size: 0.75rem; color: #446; }

  #ws-status {
    position: fixed; bottom: 20px; right: 20px; font-size: 11px;
    color: #446; pointer-events: none;
  }
  #ws-status.connected { color: #4a8; }
  #ws-status.error     { color: #a44; }

  #controls-hint {
    position: fixed; bottom: 20px; left: 20px; font-size: 10px;
    color: #334; line-height: 1.9; pointer-events: none;
  }
  #controls-hint span { color: #446; }
</style>
</head>
<body>

<div id="start-overlay">
  <h1>∞ VOID</h1>
  <p>Click to enter · Show hands to camera</p>
  <div class="hint">hand-tracker --dashboard required</div>
</div>

<div id="hud">
  <div class="label">Hand 0</div>
  <div class="val" id="h0-info">—</div>
  <br>
  <div class="label">Hand 1</div>
  <div class="val" id="h1-info">—</div>
  <br>
  <div class="label">Objects</div>
  <div class="val" id="obj-count">—</div>
</div>

<div id="gesture-flash"></div>
<div id="ws-status">⬤ connecting…</div>

<div id="controls-hint">
  <span>✊ fist</span> spawn object &nbsp;|&nbsp;
  <span>🖐 open palm</span> explode &nbsp;|&nbsp;
  <span>pinch</span> grab &amp; move &nbsp;|&nbsp;
  <span>2 hands</span> scale
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

// ─── Constants ────────────────────────────────────────────────────────────────
const WORLD_X_RANGE  = [-5.5, 5.5];
const WORLD_Y_RANGE  = [-3.5, 3.5];
const GRAB_RADIUS    = 1.8;
const PINCH_ON       = 0.70;
const PINCH_OFF      = 0.35;
const DAMPING        = 0.94;
const FLOAT_SPEED    = 0.0004;
const EXPLODE_RADIUS = 3.5;
const MAX_OBJECTS    = 20;

const GESTURES = {
  SPAWN:   'closed_fist',
  EXPLODE: 'open_palm',
};

const GLOW_COLORS = [0x6644ff, 0xff44aa, 0x44ffcc, 0xff8844, 0x44aaff, 0xffff44, 0xff4466];
const EMOJI_MAP   = { closed_fist:'✊', open_palm:'🖐', peace:'✌️', pointing:'☝️', thumbs_up:'👍', none:'' };

// ─── Scene setup ─────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x050510);
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
scene.fog    = new THREE.FogExp2(0x050510, 0.018);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 0, 11);

// Lights
scene.add(new THREE.AmbientLight(0x2233aa, 0.6));
const handLights = [
  new THREE.PointLight(0x8866ff, 0, 12),
  new THREE.PointLight(0xff66aa, 0, 12),
];
handLights.forEach(l => scene.add(l));

// ─── Stars ───────────────────────────────────────────────────────────────────
(function buildStars() {
  const geo  = new THREE.BufferGeometry();
  const pos  = new Float32Array(900 * 3);
  for (let i = 0; i < 900; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);
    const r     = 18 + Math.random() * 28;
    pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3+2] = r * Math.cos(phi);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat  = new THREE.PointsMaterial({ color: 0xaabbdd, size: 0.12, sizeAttenuation: true });
  scene.add(new THREE.Points(geo, mat));
})();

// ─── Floating objects ─────────────────────────────────────────────────────────
const floatingObjects = [];

function makeGeometry(type) {
  switch(type % 5) {
    case 0: return new THREE.SphereGeometry(0.55, 32, 32);
    case 1: return new THREE.TorusGeometry(0.5, 0.18, 16, 60);
    case 2: return new THREE.BoxGeometry(0.9, 0.9, 0.9);
    case 3: return new THREE.IcosahedronGeometry(0.6, 1);
    case 4: return new THREE.OctahedronGeometry(0.65, 0);
  }
}

function spawnObject(pos, color) {
  if (floatingObjects.length >= MAX_OBJECTS) return null;
  const idx   = floatingObjects.length;
  const c     = color || GLOW_COLORS[idx % GLOW_COLORS.length];
  const geo   = makeGeometry(idx);
  const mat   = new THREE.MeshPhongMaterial({
    color: c, emissive: c, emissiveIntensity: 0.35,
    shininess: 120, transparent: true, opacity: 0.88,
  });
  const mesh  = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos || new THREE.Vector3(
    (Math.random() - 0.5) * 8,
    (Math.random() - 0.5) * 5,
    (Math.random() - 0.5) * 2,
  ));
  mesh.userData = {
    velocity:  new THREE.Vector3((Math.random()-0.5)*0.01, (Math.random()-0.5)*0.01, 0),
    rotSpeed:  new THREE.Vector3((Math.random()-0.5)*0.012, (Math.random()-0.5)*0.012, 0),
    floatOff:  Math.random() * Math.PI * 2,
    baseColor: c,
    grabbed:   false,
    scale:     1.0,
  };
  scene.add(mesh);
  floatingObjects.push(mesh);
  return mesh;
}

// Seed initial objects
for (let i = 0; i < 5; i++) spawnObject(null);

// ─── Hand cursors ─────────────────────────────────────────────────────────────
const cursorColors   = [0x9977ff, 0xff77bb];
const handCursors    = cursorColors.map(c => {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.12, 16, 16),
    new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0 }),
  );
  scene.add(m);
  return m;
});

// Grab connection lines
const grabLines = [0, 1].map(() => {
  const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
  const mat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, linewidth: 1 });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  return line;
});

// ─── Hand state ───────────────────────────────────────────────────────────────
const handState = [0, 1].map(() => ({
  present:        false,
  pos:            new THREE.Vector3(),
  pinch:          0,
  openness:       0,
  velX:           0,
  velY:           0,
  palmRoll:       0,
  palmPitch:      0,
  palmYaw:        0,
  grabbing:       null,   // mesh
  grabOffset:     new THREE.Vector3(),
  grabRefDist:    1,
  prevPinch:      0,
  prevGesture:    '',
  prevOpenness:   0,
}));

// ─── Coord mapping ───────────────────────────────────────────────────────────
function worldPos(wx, wy) {
  return new THREE.Vector3(
    THREE.MathUtils.lerp(WORLD_X_RANGE[0], WORLD_X_RANGE[1], wx),
    THREE.MathUtils.lerp(WORLD_Y_RANGE[0], WORLD_Y_RANGE[1], wy),
    0,
  );
}

// ─── Gesture flash ────────────────────────────────────────────────────────────
let flashTimer = null;
function flashGesture(gesture) {
  const el = document.getElementById('gesture-flash');
  el.textContent = EMOJI_MAP[gesture] || gesture;
  el.style.opacity = '1';
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { el.style.opacity = '0'; }, 800);
}

// ─── Web Audio ────────────────────────────────────────────────────────────────
let audioCtx = null;
const synths  = [null, null];
let ambientDrone = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new AudioContext();

  // Ambient drone
  const droneOsc  = audioCtx.createOscillator();
  const droneGain = audioCtx.createGain();
  droneOsc.type      = 'sine';
  droneOsc.frequency.value = 55;
  droneGain.gain.value     = 0;
  droneOsc.connect(droneGain);
  droneGain.connect(audioCtx.destination);
  droneOsc.start();
  ambientDrone = { osc: droneOsc, gain: droneGain };

  // Per-hand synths
  for (let i = 0; i < 2; i++) {
    const osc    = audioCtx.createOscillator();
    const filter = audioCtx.createBiquadFilter();
    const gain   = audioCtx.createGain();
    osc.type         = i === 0 ? 'triangle' : 'sawtooth';
    osc.frequency.value   = 220;
    filter.type           = 'lowpass';
    filter.frequency.value = 800;
    filter.Q.value         = 3;
    gain.gain.value        = 0;
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    synths[i] = { osc, filter, gain };
  }
}

function playSpawnSound() {
  if (!audioCtx) return;
  const osc  = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(880, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.3);
  gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.4);
}

function playExplodeSound() {
  if (!audioCtx) return;
  const buf    = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.2, audioCtx.sampleRate);
  const data   = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1);
  const src    = audioCtx.createBufferSource();
  const filter = audioCtx.createBiquadFilter();
  const gain   = audioCtx.createGain();
  src.buffer       = buf;
  filter.type      = 'bandpass';
  filter.frequency.value = 400;
  filter.Q.value   = 0.5;
  gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
  src.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  src.start();
}

function updateAudio(handsData) {
  if (!audioCtx) return;
  const anyPresent = handsData.some(h => h.present);
  ambientDrone.gain.gain.linearRampToValueAtTime(
    anyPresent ? 0.06 : 0, audioCtx.currentTime + 0.5
  );

  handsData.forEach((h, i) => {
    if (!synths[i]) return;
    const { osc, filter, gain } = synths[i];
    if (h.present) {
      const freq   = THREE.MathUtils.lerp(80, 800, 1 - h.pos.y / WORLD_Y_RANGE[1] * 0.5 + 0.5);
      const cutoff = THREE.MathUtils.lerp(200, 8000, h.openness);
      const vol    = h.pinch * 0.25;
      osc.frequency.linearRampToValueAtTime(Math.max(40, freq), audioCtx.currentTime + 0.05);
      filter.frequency.linearRampToValueAtTime(cutoff, audioCtx.currentTime + 0.05);
      gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.05);
    } else {
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
    }
  });
}

// ─── WebSocket ────────────────────────────────────────────────────────────────
let latestFrame = null;

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws    = new WebSocket(`${proto}//${location.host}/ws`);
  const el    = document.getElementById('ws-status');

  ws.onopen  = () => { el.textContent = '⬤ connected'; el.className = 'connected'; };
  ws.onclose = () => {
    el.textContent = '⬤ disconnected — retrying…'; el.className = 'error';
    setTimeout(connectWS, 2000);
  };
  ws.onerror = () => { el.textContent = '⬤ error'; el.className = 'error'; };
  ws.onmessage = e => {
    try { latestFrame = JSON.parse(e.data); } catch {}
  };

  // Keep-alive ping
  setInterval(() => { if (ws.readyState === 1) ws.send('ping'); }, 15000);
}

connectWS();

// ─── Frame update ─────────────────────────────────────────────────────────────
function applyFrame(frame) {
  if (!frame || !frame.hands) return;
  const hands = frame.hands;

  hands.forEach((hd, i) => {
    const hs = handState[i];
    hs.present = hd.present;

    if (!hd.present) {
      handCursors[i].material.opacity = 0;
      handLights[i].intensity = 0;
      grabLines[i].material.opacity = 0;
      if (hs.grabbing) { hs.grabbing = null; }
      if (synths[i]) synths[i].gain.gain.linearRampToValueAtTime(0, audioCtx ? audioCtx.currentTime + 0.1 : 0);
      return;
    }

    hs.pos.copy(worldPos(hd.wrist_x, hd.wrist_y));
    hs.pinch     = hd.pinch;
    hs.openness  = hd.openness;
    hs.velX      = hd.velocity_x * 0.25;
    hs.velY      = hd.velocity_y * 0.25;
    hs.palmRoll  = hd.palm_roll;
    hs.palmPitch = hd.palm_pitch;
    hs.palmYaw   = hd.palm_yaw;

    // Cursor
    handCursors[i].position.copy(hs.pos);
    handCursors[i].material.opacity = 0.85;
    handLights[i].position.copy(hs.pos);
    handLights[i].intensity = 0.8 + hs.pinch * 1.4;

    // ── Grab logic ──
    const wasGrabbing = !!hs.grabbing;

    if (!hs.grabbing && hs.pinch > PINCH_ON && hs.prevPinch <= PINCH_ON) {
      // Find nearest ungrabbed object
      let best = null, bestDist = Infinity;
      floatingObjects.forEach(obj => {
        if (obj.userData.grabbed) return;
        const d = hs.pos.distanceTo(obj.position);
        if (d < GRAB_RADIUS && d < bestDist) { bestDist = d; best = obj; }
      });
      if (best) {
        hs.grabbing = best;
        best.userData.grabbed = true;
        hs.grabOffset.subVectors(best.position, hs.pos);

        // Two-hand scale reference
        const other = handState[1 - i];
        if (other.present && other.grabbing) {
          hs.grabRefDist = hs.pos.distanceTo(other.pos);
        }
      }
    }

    if (hs.grabbing) {
      const obj = hs.grabbing;
      // Move
      obj.position.copy(hs.pos).add(hs.grabOffset);
      obj.position.z = THREE.MathUtils.lerp(obj.position.z, 0, 0.08);

      // Rotate by palm orientation
      obj.rotation.x = THREE.MathUtils.lerp(obj.rotation.x, hs.palmPitch, 0.08);
      obj.rotation.y = THREE.MathUtils.lerp(obj.rotation.y, hs.palmYaw,   0.08);
      obj.rotation.z = THREE.MathUtils.lerp(obj.rotation.z, hs.palmRoll,  0.08);

      // Two-hand scale
      const other = handState[1 - i];
      if (other.present && hs.grabRefDist > 0.01) {
        const currDist = hs.pos.distanceTo(other.pos);
        const scaleFactor = THREE.MathUtils.clamp(currDist / hs.grabRefDist, 0.3, 3.0);
        const s = scaleFactor * obj.userData.scale;
        obj.scale.setScalar(THREE.MathUtils.clamp(s, 0.2, 3.0));
      }

      // Openness → scale when solo
      const other2 = handState[1 - i];
      if (!other2.present || !other2.grabbing) {
        const targetS = THREE.MathUtils.lerp(0.5, 2.5, hs.openness) * obj.userData.scale;
        obj.scale.setScalar(THREE.MathUtils.clamp(
          THREE.MathUtils.lerp(obj.scale.x, targetS, 0.06), 0.2, 3.0
        ));
      }

      // Grab line
      const pts = grabLines[i].geometry.attributes.position;
      pts.setXYZ(0, hs.pos.x, hs.pos.y, hs.pos.z);
      pts.setXYZ(1, obj.position.x, obj.position.y, obj.position.z);
      pts.needsUpdate = true;
      grabLines[i].material.opacity = 0.4;
    }

    // Release
    if (wasGrabbing && hs.pinch < PINCH_OFF) {
      if (hs.grabbing) {
        hs.grabbing.userData.velocity.set(hs.velX, -hs.velY, 0);
        hs.grabbing.userData.scale = hs.grabbing.scale.x;
        hs.grabbing.userData.grabbed = false;
        hs.grabbing = null;
      }
      grabLines[i].material.opacity = 0;
    }

    // ── Gesture edge triggers ──
    const gesture = hd.discrete_gesture;
    if (gesture !== hs.prevGesture) {
      if (gesture === GESTURES.SPAWN) {
        const newObj = spawnObject(hs.pos.clone().add(new THREE.Vector3(
          (Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5, 0
        )));
        if (newObj) playSpawnSound();
        flashGesture(gesture);
      }
      if (gesture === GESTURES.EXPLODE) {
        let hit = false;
        floatingObjects.forEach(obj => {
          const d = hs.pos.distanceTo(obj.position);
          if (d < EXPLODE_RADIUS) {
            const dir = obj.position.clone().sub(hs.pos).normalize();
            const force = (EXPLODE_RADIUS - d) / EXPLODE_RADIUS * 0.18;
            obj.userData.velocity.addScaledVector(dir, force);
            hit = true;
          }
        });
        if (hit) { playExplodeSound(); flashGesture(gesture); }
      }
      if (gesture && gesture !== 'none') flashGesture(gesture);
    }

    hs.prevPinch   = hs.pinch;
    hs.prevGesture = gesture;
  });
}

// ─── Physics tick ─────────────────────────────────────────────────────────────
let tick = 0;
function physicsStep() {
  tick++;
  floatingObjects.forEach((obj, idx) => {
    if (obj.userData.grabbed) return;
    const ud = obj.userData;

    // Velocity damping
    ud.velocity.multiplyScalar(DAMPING);

    // Gentle float bobbing
    const bob = Math.sin(tick * FLOAT_SPEED * 60 + ud.floatOff) * 0.0006;
    ud.velocity.y += bob;

    obj.position.add(ud.velocity);

    // Slow auto-rotation
    obj.rotation.x += ud.rotSpeed.x;
    obj.rotation.y += ud.rotSpeed.y;

    // Soft boundary bounce
    if (Math.abs(obj.position.x) > 6.5) { ud.velocity.x *= -0.6; obj.position.x = Math.sign(obj.position.x) * 6.5; }
    if (Math.abs(obj.position.y) > 4.5) { ud.velocity.y *= -0.6; obj.position.y = Math.sign(obj.position.y) * 4.5; }
    if (Math.abs(obj.position.z) > 3)   { ud.velocity.z *= -0.6; obj.position.z = Math.sign(obj.position.z) * 3; }

    // Pulse emissive intensity with pinch of nearest hand
    const nearPinch = handState.reduce((best, hs) => {
      if (!hs.present) return best;
      const d = hs.pos.distanceTo(obj.position);
      return d < best.d ? { d, pinch: hs.pinch } : best;
    }, { d: Infinity, pinch: 0 });
    obj.material.emissiveIntensity = 0.25 + nearPinch.pinch * 0.55 + Math.sin(tick * 0.03 + ud.floatOff) * 0.08;
  });
}

// ─── HUD update ───────────────────────────────────────────────────────────────
let hudTick = 0;
function updateHUD() {
  if (++hudTick % 6 !== 0) return;
  [0, 1].forEach(i => {
    const hs = handState[i];
    const el = document.getElementById(`h${i}-info`);
    if (!hs.present) { el.textContent = '—'; return; }
    el.textContent =
      `pinch ${hs.pinch.toFixed(2)}  open ${hs.openness.toFixed(2)}` +
      (hs.grabbing ? '  [grabbing]' : '');
  });
  document.getElementById('obj-count').textContent = `${floatingObjects.length} / ${MAX_OBJECTS}`;
}

// ─── Render loop ──────────────────────────────────────────────────────────────
let animStarted = false;
function animate() {
  requestAnimationFrame(animate);
  if (latestFrame) {
    applyFrame(latestFrame);
    updateAudio(handState);
    latestFrame = null;
  }
  physicsStep();
  updateHUD();
  renderer.render(scene, camera);
}

// ─── Start on click ───────────────────────────────────────────────────────────
const overlay = document.getElementById('start-overlay');
overlay.addEventListener('click', () => {
  initAudio();
  overlay.style.opacity = '0';
  setTimeout(() => overlay.style.display = 'none', 600);
  if (!animStarted) { animStarted = true; animate(); }
}, { once: true });

// ─── Resize ───────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
