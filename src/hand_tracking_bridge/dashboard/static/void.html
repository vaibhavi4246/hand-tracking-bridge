<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Void — Hand Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #03050e;
  --surface: rgba(255,255,255,0.05);
  --border:  rgba(255,255,255,0.09);
  --accent:  #7c5aff;
  --cyan:    #00d4ff;
  --text:    #e8eaf0;
  --muted:   #4a4e6a;
  --danger:  #ff4466;
  --glass:   blur(18px) saturate(160%);
  --r:       10px;
  --nav-h:   48px;
  --panel-w: 220px;
  --font:    'Inter', sans-serif;
  --fhead:   'Space Grotesk', sans-serif;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:var(--font); }

/* ── Nav ── */
#nav {
  position:fixed; top:0; left:0; right:0; height:var(--nav-h); z-index:200;
  display:flex; align-items:center; justify-content:space-between; padding:0 20px;
  background:rgba(3,5,14,0.7); backdrop-filter:var(--glass);
  border-bottom:1px solid var(--border);
}
#nav .logo { font-family:var(--fhead); font-size:18px; font-weight:700; color:var(--accent); letter-spacing:-0.5px; }
#nav .logo span { color:var(--cyan); }
#ws-dot { display:flex; align-items:center; gap:7px; font-size:11px; color:var(--muted); }
#ws-dot .dot { width:7px; height:7px; border-radius:50%; background:var(--muted); transition:background .4s; }
#ws-dot.ok  .dot { background:#4ade80; box-shadow:0 0 6px #4ade8088; }
#ws-dot.err .dot { background:var(--danger); }

/* ── Canvas fills under nav ── */
#canvas-wrap {
  position:fixed; top:var(--nav-h); left:0; right:0; bottom:0;
}
#canvas-wrap canvas { display:block; }

/* ── Side panels ── */
.side-panel {
  position:fixed; top:var(--nav-h); bottom:0; width:var(--panel-w);
  z-index:100; padding:16px 14px;
  display:flex; flex-direction:column; gap:12px;
  pointer-events:none;
  overflow:hidden;
}
#panel-left  { left:0; }
#panel-right { right:0; }

.panel-card {
  background:rgba(3,5,14,0.72); backdrop-filter:var(--glass);
  border:1px solid var(--border); border-radius:var(--r);
  padding:12px 14px;
}
.panel-card .card-title {
  font-size:9px; font-weight:600; letter-spacing:2.5px; text-transform:uppercase;
  color:var(--muted); margin-bottom:10px;
}

/* hand rows */
.hrow { display:flex; justify-content:space-between; font-size:11px; margin-top:5px; }
.hrow .lbl { color:var(--muted); }
.hrow .val { font-family:var(--fhead); font-weight:600; color:var(--text); }
.bar-track { height:3px; background:rgba(255,255,255,0.08); border-radius:2px; margin-top:3px; }
.bar-fill  { height:3px; border-radius:2px; width:0%; transition:width .09s; }
.bf-pinch  { background:var(--accent); }
.bf-open   { background:var(--cyan); }

/* pos pad */
.pos-pad {
  width:100%; aspect-ratio:1; border:1px solid var(--border);
  border-radius:var(--r); background:rgba(255,255,255,0.02);
  position:relative; overflow:hidden; margin-top:8px;
}
.pos-dot {
  width:9px; height:9px; border-radius:50%;
  position:absolute; transform:translate(-50%,-50%);
  transition:left .08s, top .08s;
  box-shadow:0 0 10px currentColor;
}

/* ── Studio controls (right panel) ── */
.note-big {
  font-family:var(--fhead); font-size:52px; font-weight:700; line-height:1;
  text-align:center; color:var(--text);
  text-shadow:0 0 30px var(--accent), 0 0 60px var(--cyan);
  transition:color .1s;
  margin:4px 0;
}
.note-sub { font-size:10px; color:var(--muted); text-align:center; letter-spacing:1px; }
.note-freq { font-family:var(--fhead); font-size:12px; color:var(--cyan); text-align:center; margin-top:2px; }

.scale-pills { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
.scale-pill {
  background:none; border:1px solid var(--border); color:var(--muted);
  font-family:var(--font); font-size:10px; font-weight:500;
  padding:4px 9px; border-radius:20px; cursor:pointer; transition:all .18s;
  pointer-events:all;
}
.scale-pill:hover  { color:var(--text); border-color:rgba(255,255,255,0.2); }
.scale-pill.active { color:#fff; background:var(--accent); border-color:var(--accent); }

.oct-row {
  display:flex; align-items:center; justify-content:center; gap:14px; margin-top:8px;
}
.oct-btn {
  width:28px; height:28px; border-radius:50%;
  background:var(--surface); border:1px solid var(--border);
  color:var(--text); font-size:16px; cursor:pointer; transition:all .15s;
  display:flex; align-items:center; justify-content:center; pointer-events:all;
}
.oct-btn:hover { background:rgba(124,90,255,0.25); border-color:var(--accent); }
.oct-lbl { font-size:9px; letter-spacing:2px; color:var(--muted); text-align:center; }
.oct-val { font-family:var(--fhead); font-size:18px; font-weight:700; text-align:center; color:var(--text); }

#audio-btn {
  width:100%; padding:8px; border-radius:20px; border:none;
  background:var(--accent); color:#fff;
  font-family:var(--font); font-size:12px; font-weight:600;
  cursor:pointer; transition:opacity .2s; margin-top:8px;
  pointer-events:all;
}
#audio-btn:disabled { opacity:0.4; }

#waveform {
  width:100%; height:48px; display:block; margin-top:8px;
  border-radius:var(--r); background:rgba(255,255,255,0.02);
  border:1px solid var(--border);
}

/* ── Orb scale readout ── */
.orb-row { display:flex; justify-content:space-between; font-size:11px; }
.orb-row .lbl { color:var(--muted); }
.orb-row .val { font-family:var(--fhead); color:var(--cyan); font-weight:600; }

/* ── Gesture flash ── */
#gflash {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  font-size:72px; opacity:0; pointer-events:none; z-index:150;
  filter:drop-shadow(0 0 20px var(--accent));
  transition:opacity .12s;
}

/* ── Bottom hints ── */
#hints {
  position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
  display:flex; gap:14px; pointer-events:none; z-index:100;
}
.hint {
  background:rgba(3,5,14,0.72); backdrop-filter:var(--glass);
  border:1px solid var(--border); border-radius:20px;
  padding:4px 11px; font-size:10px; color:var(--muted); white-space:nowrap;
}
.hint strong { color:var(--text); }

/* ── Start overlay ── */
#overlay {
  position:fixed; inset:0; z-index:300;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:rgba(3,5,14,0.88); backdrop-filter:blur(8px); cursor:pointer;
  transition:opacity .6s;
}
#overlay h2 { font-family:var(--fhead); font-size:2.2rem; font-weight:700; color:var(--accent); margin-bottom:10px; letter-spacing:-1px; }
#overlay p  { font-size:.9rem; color:var(--muted); letter-spacing:1px; }
</style>
</head>
<body>

<!-- Start overlay -->
<div id="overlay">
  <h2>Particle Void</h2>
  <p>Click to begin · Show hands to camera</p>
</div>

<!-- Nav -->
<nav id="nav">
  <div class="logo">◎ <span>PARTICLE</span> VOID</div>
  <div style="display:flex;gap:4px;">
    <a href="/" style="background:none;border:1px solid var(--border);color:var(--muted);font-family:var(--font);font-size:13px;font-weight:500;padding:5px 16px;border-radius:20px;cursor:pointer;text-decoration:none;transition:all .18s;" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--muted)'">Dashboard</a>
    <a href="/void" style="color:var(--text);background:var(--surface);border:1px solid var(--border);font-family:var(--font);font-size:13px;font-weight:500;padding:5px 16px;border-radius:20px;cursor:pointer;text-decoration:none;">Particle Void</a>
  </div>
  <div id="ws-dot"><div class="dot"></div><span id="ws-lbl">connecting</span></div>
</nav>

<!-- Canvas -->
<div id="canvas-wrap"></div>

<!-- Left: hand tracking -->
<div class="side-panel" id="panel-left">

  <div class="panel-card" id="card-h0">
    <div class="card-title">Hand 0</div>
    <div class="pos-pad" id="h0-pad">
      <div class="pos-dot" id="h0-dot" style="color:var(--accent); left:50%; top:50%;"></div>
    </div>
    <div class="hrow"><span class="lbl">Pinch</span><span class="val" id="h0-pinch">—</span></div>
    <div class="bar-track"><div class="bar-fill bf-pinch" id="h0-pinch-bar"></div></div>
    <div class="hrow"><span class="lbl">Open</span><span class="val" id="h0-open">—</span></div>
    <div class="bar-track"><div class="bar-fill bf-open" id="h0-open-bar"></div></div>
    <div class="hrow"><span class="lbl">Gesture</span><span class="val" id="h0-gest">—</span></div>
  </div>

  <div class="panel-card" id="card-h1">
    <div class="card-title">Hand 1</div>
    <div class="pos-pad" id="h1-pad">
      <div class="pos-dot" id="h1-dot" style="color:var(--cyan); left:50%; top:50%;"></div>
    </div>
    <div class="hrow"><span class="lbl">Pinch</span><span class="val" id="h1-pinch">—</span></div>
    <div class="bar-track"><div class="bar-fill bf-pinch" id="h1-pinch-bar"></div></div>
    <div class="hrow"><span class="lbl">Open</span><span class="val" id="h1-open">—</span></div>
    <div class="bar-track"><div class="bar-fill bf-open" id="h1-open-bar"></div></div>
    <div class="hrow"><span class="lbl">Gesture</span><span class="val" id="h1-gest">—</span></div>
  </div>

  <div class="panel-card">
    <div class="card-title">Orb</div>
    <div class="orb-row"><span class="lbl">Scale</span><span class="val" id="orb-scale">1.00×</span></div>
  </div>

</div>

<!-- Studio panel removed -->

<!-- Gesture flash -->
<div id="gflash"></div>

<!-- Bottom hints -->
<div id="hints">
  <div class="hint"><strong>2 hands</strong> spread / pinch to zoom</div>
  <div class="hint"><strong>1 hand</strong> move to rotate</div>
  <div class="hint"><strong>pinch</strong> compress</div>
  <div class="hint"><strong>🖐 open</strong> burst</div>
  <div class="hint"><strong>✊ fist</strong> implode</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';

// ─── Config ───────────────────────────────────────────────────────────────────
const CFG = {
  orb:     { mainR: 1.8, innerR: 0.50, ringR: 2.4, ringW: 0.20 },
  counts:  { main: 4000, inner: 600, ring: 900 },
  smooth:  { pos: 0.09, pinch: 0.13, orient: 0.07, open: 0.09 },
  bloom:   { strength: 0.30, radius: 0.20, threshold: 0.22 },
  physics: { restore: 0.12, breatheAmp: 0.003, drift: 0.88 },
  world:   { x: [-5, 5], y: [-3, 3] },
};
const TOTAL = CFG.counts.main + CFG.counts.inner + CFG.counts.ring;
const GESTURE_EMOJI = { fist:'✊', open:'🖐', peace:'✌️', pointing:'☝️', thumbs_up:'👍' };

// ─── Smoother ─────────────────────────────────────────────────────────────────
class SV {
  constructor(a) { this._a = a; this._v = null; }
  push(x) { return this._v === null ? (this._v = x) : (this._v += (x - this._v) * this._a); }
  get()   { return this._v ?? 0; }
  reset() { this._v = null; }
}

// ─── WebSocket ────────────────────────────────────────────────────────────────
let latestFrame = null;
const wsDot = document.getElementById('ws-dot');
const wsLbl = document.getElementById('ws-lbl');
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${proto}//${location.host}/ws`);
  ws.onopen    = () => { wsDot.className = 'ok';  wsLbl.textContent = 'live'; };
  ws.onclose   = () => { wsDot.className = 'err'; wsLbl.textContent = 'offline'; setTimeout(connectWS, 2000); };
  ws.onerror   = () => { wsDot.className = 'err'; wsLbl.textContent = 'error'; };
  ws.onmessage = e => { try { latestFrame = JSON.parse(e.data); } catch {} };
  setInterval(() => { if (ws.readyState === 1) ws.send('ping'); }, 15000);
}
connectWS();

// ─── Three.js scene ───────────────────────────────────────────────────────────
const W = () => window.innerWidth;
const H = () => window.innerHeight - 48;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W(), H());
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('canvas-wrap').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog   = new THREE.FogExp2(0x03050e, 0.010);

const camera = new THREE.PerspectiveCamera(55, W() / H(), 0.1, 200);
camera.position.set(0, 0, 12);

const composer  = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(W(), H()),
  CFG.bloom.strength, CFG.bloom.radius, CFG.bloom.threshold,
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

scene.add(new THREE.AmbientLight(0x0a1040, 1.8));

// Stars
(function(){
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(1400 * 3);
  for (let i = 0; i < 1400; i++) {
    const t = Math.random()*Math.PI*2, p = Math.acos(2*Math.random()-1), r = 22+Math.random()*30;
    pos[i*3]   = r*Math.sin(p)*Math.cos(t);
    pos[i*3+1] = r*Math.sin(p)*Math.sin(t);
    pos[i*3+2] = r*Math.cos(p);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ color:0x556699, size:0.07, sizeAttenuation:true })));
})();

// ─── Particle orb buffers ─────────────────────────────────────────────────────
const basePos = new Float32Array(TOTAL * 3);
const currPos = new Float32Array(TOTAL * 3);
const currVel = new Float32Array(TOTAL * 3);
const pColors = new Float32Array(TOTAL * 3);
const pSizes  = new Float32Array(TOTAL);
const phases  = new Float32Array(TOTAL);

function rndSph(r) {
  const t = Math.random()*Math.PI*2, p = Math.acos(2*Math.random()-1);
  return [r*Math.sin(p)*Math.cos(t), r*Math.sin(p)*Math.sin(t), r*Math.cos(p)];
}

for (let i = 0; i < TOTAL; i++) {
  let x,y,z, r,g,b, sz;

  if (i < CFG.counts.main) {
    // Outer sphere: deep blue -> cyan top-to-bottom
    const rad = CFG.orb.mainR * (0.88 + Math.random()*0.16);
    [x,y,z] = rndSph(rad);
    const t = (y/rad + 1)*0.5;
    r = 0.02 + 0.06*t;
    g = 0.28 + 0.52*t;
    b = 0.88 + 0.12*t;
    sz = 0.8 + Math.random()*1.2;  // 0.8-2.0

  } else if (i < CFG.counts.main + CFG.counts.inner) {
    // Inner core: bright white-blue
    const rad = CFG.orb.innerR * (0.1 + Math.random()*0.9);
    [x,y,z] = rndSph(rad);
    r = 0.5 + Math.random()*0.5;
    g = 0.75 + Math.random()*0.25;
    b = 1.0;
    sz = 0.5 + Math.random()*1.0;  // 0.5-1.5

  } else {
    // Equatorial ring: teal/cyan
    const theta = Math.random()*Math.PI*2;
    const radVar = CFG.orb.ringR + (Math.random()-0.5)*CFG.orb.ringW*2;
    x = radVar*Math.cos(theta);
    y = (Math.random()-0.5)*CFG.orb.ringW*0.5;
    z = radVar*Math.sin(theta);
    r = 0.0;
    g = 0.80 + Math.random()*0.20;
    b = 0.70 + Math.random()*0.30;
    sz = 0.6 + Math.random()*0.9;  // 0.6-1.5
  }

  const idx = i*3;
  basePos[idx]   = currPos[idx]   = x;
  basePos[idx+1] = currPos[idx+1] = y;
  basePos[idx+2] = currPos[idx+2] = z;
  pColors[idx] = r; pColors[idx+1] = g; pColors[idx+2] = b;
  pSizes[i] = sz;
  phases[i] = Math.random()*Math.PI*2;
}

const orbGeo = new THREE.BufferGeometry();
orbGeo.setAttribute('position', new THREE.BufferAttribute(currPos, 3));
orbGeo.setAttribute('aColor',   new THREE.BufferAttribute(pColors, 3));
orbGeo.setAttribute('aSize',    new THREE.BufferAttribute(pSizes, 1));

// Shader: soft glowing circle per particle, size in world-space units
const orbMat = new THREE.ShaderMaterial({
  vertexShader: `
    attribute float aSize;
    attribute vec3  aColor;
    varying   vec3  vColor;
    void main() {
      vColor = aColor;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * (96.0 / -mv.z);
      gl_Position  = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float a = smoothstep(0.5, 0.28, d) * 0.92;
      gl_FragColor = vec4(vColor, a);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});

const orbGroup = new THREE.Group();
scene.add(orbGroup);
orbGroup.add(new THREE.Points(orbGeo, orbMat));

// Tiny central core
const coreMesh = new THREE.Mesh(
  new THREE.SphereGeometry(0.14, 24, 24),
  new THREE.MeshStandardMaterial({
    color: 0x0044ff, emissive: 0x0033cc, emissiveIntensity: 0.7,
    transparent: true, opacity: 0.20, roughness: 0.05, metalness: 0.9,
  }),
);
orbGroup.add(coreMesh);

const orbLight = new THREE.PointLight(0x0066ff, 0.5, 5);
orbGroup.add(orbLight);

// Orb state
const orbState = {
  scale: 1.0, targetScale: 1.0,
  rotVelX: 0, rotVelY: 0.0004,
  handsPresent: false, bothPresent: false,
  explodeStr: 0, implodeStr: 0,
  refDist: -1, refScale: 1.0,
  prevGestures: ['', ''],
  dominantGesture: 'none',
};

// Hand cursors
const cursors = [0xaa66ff, 0x00ddff].map(color => {
  const m = new THREE.Mesh(
    new THREE.TorusGeometry(0.10, 0.012, 8, 32),
    new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 3.5, roughness:0.1, metalness:0.5 }),
  );
  m.visible = false;
  scene.add(m);
  return m;
});

const handLights = [0xaa66ff, 0x00ddff].map(c => {
  const l = new THREE.PointLight(c, 0, 6);
  scene.add(l);
  return l;
});

// ─── Hand state ───────────────────────────────────────────────────────────────
function makeHS() {
  return {
    present: false,
    sx: new SV(CFG.smooth.pos), sy: new SV(CFG.smooth.pos),
    sp: new SV(CFG.smooth.pinch), so: new SV(CFG.smooth.open),
    sr: new SV(CFG.smooth.orient), sch: new SV(CFG.smooth.orient), sy2: new SV(CFG.smooth.orient),
    worldPos: new THREE.Vector3(),
    pinch: 0, openness: 0, velX: 0, velY: 0,
    gesture: 'none', prevGesture: '',
  };
}
const hs = [makeHS(), makeHS()];

function toWorld(wx, wy) {
  return new THREE.Vector3(
    THREE.MathUtils.lerp(CFG.world.x[0], CFG.world.x[1], wx),
    THREE.MathUtils.lerp(CFG.world.y[0], CFG.world.y[1], wy),
    0,
  );
}

// ─── Gesture flash ────────────────────────────────────────────────────────────
let flashTimer;
function flash(g) {
  const el = document.getElementById('gflash');
  el.textContent = GESTURE_EMOJI[g] || g;
  el.style.opacity = '1';
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => el.style.opacity = '0', 900);
}

// ─── Apply frame -> orb state ─────────────────────────────────────────────────
function applyOrb(frame) {
  if (!frame?.hands) return;
  const numPresent = frame.hands.filter(h => h.present).length;
  const bothPresent = numPresent === 2;
  orbState.handsPresent = numPresent > 0;
  orbState.bothPresent = bothPresent;

  // Track dominant gesture for orb light color
  let dominant = 'none';

  frame.hands.forEach((hd, i) => {
    const h = hs[i];
    h.present = hd.present;

    if (!hd.present) {
      cursors[i].visible = false;
      handLights[i].intensity = 0;
      h.sx.reset(); h.sy.reset(); h.sp.reset(); h.so.reset();
      return;
    }

    const wx = h.sx.push(hd.wrist_x);
    const wy = h.sy.push(hd.wrist_y);
    h.pinch    = h.sp.push(hd.pinch);
    h.openness = h.so.push(hd.openness);
    h.velX = hd.velocity_x;
    h.velY = hd.velocity_y;
    h.sr.push(hd.palm_roll);
    h.sch.push(hd.palm_pitch);
    h.sy2.push(hd.palm_yaw);
    h.worldPos.copy(toWorld(wx, wy));
    h.gesture = hd.discrete_gesture || 'none';

    cursors[i].visible = true;
    cursors[i].position.lerp(h.worldPos, 0.18);
    cursors[i].rotation.x += 0.04;
    cursors[i].rotation.z += 0.025;
    handLights[i].position.copy(cursors[i].position);
    handLights[i].intensity = 0.4 + h.pinch * 2.0;

    // Impulse-based rotation from backend velocity (not during two-hand zoom)
    if (!bothPresent) {
      orbState.rotVelY += hd.velocity_x * 0.4;
      orbState.rotVelX -= hd.velocity_y * 0.25;
    }

    // Gesture edge detection for burst effects
    const g = h.gesture;
    if (g !== orbState.prevGestures[i]) {
      if (g === 'open')  { orbState.explodeStr = 1.0; flash(g); }
      if (g === 'fist')  { orbState.implodeStr = 1.0; flash(g); }
      if (GESTURE_EMOJI[g]) flash(g);
      orbState.prevGestures[i] = g;
    }

    // Determine dominant gesture for light color
    if (g === 'fist') dominant = 'fist';
    else if (g === 'open' && dominant !== 'fist') dominant = 'open';
    else if (h.pinch > 0.12 && dominant === 'none') dominant = 'pinch';

    h.prevGesture = g;
  });

  orbState.dominantGesture = dominant;

  // Two-hand zoom
  if (bothPresent && hs[0].present && hs[1].present) {
    const dist = hs[0].worldPos.distanceTo(hs[1].worldPos);
    if (orbState.refDist < 0) { orbState.refDist = dist; orbState.refScale = orbState.scale; }
    const ratio = dist / Math.max(orbState.refDist, 0.2);
    orbState.targetScale = THREE.MathUtils.clamp(ratio * orbState.refScale, 0.10, 3.5);
  } else {
    if (orbState.refDist >= 0) orbState.refDist = -1;
  }
}

// ─── Particle physics ─────────────────────────────────────────────────────────
let tick = 0;
function physicsStep() {
  tick++;
  const t = tick * 0.016;

  // Scale lerp
  orbState.scale = THREE.MathUtils.lerp(orbState.scale, orbState.targetScale, 0.07);
  orbGroup.scale.setScalar(orbState.scale);

  // Rotation: friction-based decay each render frame
  orbState.rotVelY *= 0.96;
  orbState.rotVelX *= 0.96;

  // No hands: gently decay toward slow idle spin
  if (!orbState.handsPresent) {
    orbState.rotVelY = THREE.MathUtils.lerp(orbState.rotVelY, 0.0004, 0.015);
    orbState.rotVelX = THREE.MathUtils.lerp(orbState.rotVelX, 0, 0.04);
  }

  // Clamp rotation velocities
  orbState.rotVelY = THREE.MathUtils.clamp(orbState.rotVelY, -0.06, 0.06);
  orbState.rotVelX = THREE.MathUtils.clamp(orbState.rotVelX, -0.04, 0.04);

  orbGroup.rotation.x += orbState.rotVelX;
  orbGroup.rotation.y += orbState.rotVelY;

  // Orb light: color-shift based on dominant gesture
  const gestColor = orbState.dominantGesture === 'fist' ? 0xff2200
    : orbState.dominantGesture === 'pinch' ? 0xffffff
    : 0x0066ff; // open and default both blue
  orbLight.color.set(gestColor);

  // Orb light: intensity pulses with explode/implode
  orbLight.intensity = 0.5 + orbState.explodeStr * 1.5 + orbState.implodeStr * 1.5;

  coreMesh.material.emissiveIntensity = 0.65 + Math.sin(t * 1.5) * 0.08;

  // Decay burst strengths
  if (orbState.explodeStr > 0) orbState.explodeStr = Math.max(0, orbState.explodeStr - 0.018);
  if (orbState.implodeStr > 0) orbState.implodeStr = Math.max(0, orbState.implodeStr - 0.018);

  // Pinch compression: max across hands
  let maxPinchForce = 0;
  hs.forEach(h => {
    if (h.present && h.pinch > 0.12) {
      const f = (h.pinch - 0.12) / 0.88 * 0.13;
      maxPinchForce = Math.max(maxPinchForce, f);
    }
  });

  // CRITICAL FIX: compute hand positions in orbGroup LOCAL space before particle loop
  // This ensures gravity well works correctly regardless of orbGroup rotation
  orbGroup.updateMatrixWorld(true);
  const localHandPos = hs.map(h => {
    if (!h.present) return null;
    const lp = h.worldPos.clone();
    orbGroup.worldToLocal(lp);
    return { lp, velX: h.velX, velY: h.velY, openness: h.openness, pinch: h.pinch, gesture: h.gesture };
  });

  for (let i = 0; i < TOTAL; i++) {
    const idx = i * 3;
    const breathe = 1.0 + Math.sin(t * 0.9 + phases[i]) * CFG.physics.breatheAmp;
    const bx = basePos[idx]   * breathe;
    const by = basePos[idx+1] * breathe;
    const bz = basePos[idx+2] * breathe;

    // Explode burst: push particles outward radially
    if (orbState.explodeStr > 0) {
      const len = Math.sqrt(bx*bx + by*by + bz*bz) + 0.001;
      const f = orbState.explodeStr * 0.28;
      currVel[idx]   += (bx/len)*f;
      currVel[idx+1] += (by/len)*f;
      currVel[idx+2] += (bz/len)*f;
    }

    // Implode burst: pull particles toward center
    if (orbState.implodeStr > 0) {
      const f = orbState.implodeStr * 0.22;
      currVel[idx]   -= currPos[idx]  *f;
      currVel[idx+1] -= currPos[idx+1]*f;
      currVel[idx+2] -= currPos[idx+2]*f;
    }

    // Pinch compression toward center
    if (maxPinchForce > 0) {
      currVel[idx]   -= currPos[idx]   * maxPinchForce;
      currVel[idx+1] -= currPos[idx+1] * maxPinchForce;
      currVel[idx+2] -= currPos[idx+2] * maxPinchForce;
    }

    // Hand gravity well + velocity wake (in LOCAL space)
    for (let hi = 0; hi < localHandPos.length; hi++) {
      const lh = localHandPos[hi];
      if (!lh) continue;
      const dx = currPos[idx]   - lh.lp.x;
      const dy = currPos[idx+1] - lh.lp.y;
      const dz = currPos[idx+2] - lh.lp.z;
      const dist2 = dx*dx + dy*dy + dz*dz;
      const R2 = 4.5;
      if (dist2 < R2) {
        const dist = Math.sqrt(dist2) + 0.001;
        const falloff = 1.0 - dist2 / R2;

        // Continuous gesture-based gravity:
        // fist = attract (+1), open = repel (-1), default = openness-based
        let sign, strength;
        if (lh.gesture === 'fist') {
          sign = 1.0;
          strength = 0.025;
        } else if (lh.gesture === 'open') {
          sign = -1.0;
          strength = 0.020;
        } else {
          sign = lh.openness > 0.65 ? -1.0 : 1.0;
          strength = 0.016;
        }

        const gf = sign * strength * falloff;
        currVel[idx]   += (dx / dist) * gf;
        currVel[idx+1] += (dy / dist) * gf;
        currVel[idx+2] += (dz / dist) * gf;

        // Velocity wake in local space
        currVel[idx]   += lh.velX * 0.10 * falloff;
        currVel[idx+1] += lh.velY * 0.10 * falloff;
      }
    }

    // Restore toward base position
    currVel[idx]   += (bx - currPos[idx])   * CFG.physics.restore;
    currVel[idx+1] += (by - currPos[idx+1]) * CFG.physics.restore;
    currVel[idx+2] += (bz - currPos[idx+2]) * CFG.physics.restore;

    // Drift (damping)
    currVel[idx]   *= CFG.physics.drift;
    currVel[idx+1] *= CFG.physics.drift;
    currVel[idx+2] *= CFG.physics.drift;

    // Integrate
    currPos[idx]   += currVel[idx];
    currPos[idx+1] += currVel[idx+1];
    currPos[idx+2] += currVel[idx+2];
  }
  orbGeo.attributes.position.needsUpdate = true;
}

// ─── HUD update ───────────────────────────────────────────────────────────────
let hudTick = 0;
function updateHUD() {
  if (++hudTick % 3 !== 0) return;
  [0, 1].forEach(i => {
    const h = hs[i];
    document.getElementById(`h${i}-pinch`).textContent      = h.present ? h.pinch.toFixed(2)    : '—';
    document.getElementById(`h${i}-open`).textContent       = h.present ? h.openness.toFixed(2)  : '—';
    document.getElementById(`h${i}-gest`).textContent       = h.present ? (h.gesture || '—')     : '—';
    document.getElementById(`h${i}-pinch-bar`).style.width  = h.present ? `${h.pinch * 100}%`    : '0%';
    document.getElementById(`h${i}-open-bar`).style.width   = h.present ? `${h.openness * 100}%` : '0%';
    const dot = document.getElementById(`h${i}-dot`);
    if (h.present) {
      dot.style.left = `${h.sx.get() * 100}%`;
      dot.style.top  = `${(1 - h.sy.get()) * 100}%`;
    }
  });
  document.getElementById('orb-scale').textContent = orbState.scale.toFixed(2) + '×';
}

// ─── Main loop ────────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  if (latestFrame) {
    applyOrb(latestFrame);
    latestFrame = null;
  }
  physicsStep();
  updateHUD();
  composer.render();
}
animate();

// Overlay click
document.getElementById('overlay').addEventListener('click', () => {
  const ov = document.getElementById('overlay');
  ov.style.opacity = '0'; ov.style.pointerEvents = 'none';
  setTimeout(() => ov.remove(), 700);
}, { once: true });

// Resize
window.addEventListener('resize', () => {
  const w = W(), h = H();
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloomPass.resolution.set(w, h);
});
</script>
</body>
