name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install system deps for OpenCV headless (CI has no display)
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          # Use headless OpenCV in CI (no display needed)
          pip install opencv-python-headless --force-reinstall

      - name: Check formatting (black)
        run: black --check src/ tests/

      - name: Lint (flake8)
        run: flake8 src/ tests/

      - name: Type check (mypy)
        run: mypy src/
        continue-on-error: true  # Warn but don't fail on type errors initially

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=hand_tracking_bridge \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  lint-only:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install black flake8
      - run: black --check src/ tests/
      - run: flake8 src/ tests/ --max-line-length=100
