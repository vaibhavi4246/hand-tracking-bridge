[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hand-tracking-bridge"
version = "2.0.0"
description = "Real-time hand tracking pipeline: MediaPipe → OSC / WebSocket / File"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["hand-tracking", "mediapipe", "osc", "touchdesigner", "real-time", "gesture"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Video",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "mediapipe>=0.10.13",
    "opencv-python>=4.9.0",
    "python-osc>=1.8.3",
    "numpy>=1.26.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
]
websocket = [
    "websockets>=12.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "flake8>=7.0",
    "mypy>=1.9",
    "types-all",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "httpx>=0.27.0",  # for FastAPI test client
]
all = [
    "hand-tracking-bridge[dashboard,websocket]",
]

[project.scripts]
hand-tracker = "hand_tracking_bridge.cli:main"

[project.urls]
Homepage = "https://github.com/vaibhavi4246/hand-tracking-bridge"
Repository = "https://github.com/vaibhavi4246/hand-tracking-bridge"
Issues = "https://github.com/vaibhavi4246/hand-tracking-bridge/issues"

# ─── Tool configuration ────────────────────────────────────────────────────────

[tool.hatch.build.targets.wheel]
packages = ["src/hand_tracking_bridge"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
exclude = '''
/(
    \.git
  | __pycache__
  | \.venv
  | build
  | dist
)/
'''

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist", ".venv"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# Relaxed for initial release; tighten incrementally:
# strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/hand_tracking_bridge"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
